<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lantern</title>
<meta name="description" content="Lantern: a peer-to-peer virtual tabletop with dynamic fog of war and true-distance tools.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IM+Fell+English+SC&display=swap">
<style>
:root{
  --bg:#14120f;--panel:#1a1713;--card:#1c1915;--raised:#25211c;--sunk:#14120f;--line:#3a342b;--line-hi:#5a4a2e;
  --text:#ece4d6;--soft:#d9cfbd;--muted:#a89d8b;--faint:#7d7466;
  --brass:#d9a441;--brass-hi:#f1c46b;--brass-bg:#3a2f1c;
  --party:#7fb3ff;--enemy:#e06a2c;--neutral:#cdbf9f;
  --hp:#79c27d;--shield:#ddd6c6;--major:#d9a441;--minor:#9ad8ff;--react:#e07ad0;--move:#a98bff;
  --pos:#8fc0ff;--neg:#f08a3c;--stat:#cdbf9f;--danger:#e8a184;
  --ui:'IBM Plex Sans Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --display:'IM Fell English SC',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:14px;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}

/* buttons & inputs */
.btn{height:34px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--raised);border:1px solid var(--line);border-radius:6px;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#57503f;background:#2c2721}
.btn.primary{background:var(--brass);color:#14120f;border-color:var(--brass);font-weight:600}
.btn.primary:hover{background:var(--brass-hi)}
.btn.blue{background:#2b3f5e;color:#cfe2ff;border-color:#3f5a82;font-weight:600}
.btn.blue:hover{background:#344c70}
.btn.danger{color:var(--danger)}
.btn.dmg{background:#4a2418;color:#ffcfb8;border-color:#6b3422;font-weight:600}
.btn.heal{background:#1f3a24;color:#c4ecc6;border-color:#2f5536;font-weight:600}
.btn.shd{background:#2c2924;color:#e8e2d4;border-color:#4a443a;font-weight:600}
.btn.icon{width:34px;padding:0}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.btn.big{height:44px;font-size:15px;border-radius:8px}
.btn svg,.tool svg{flex:none}
.input,select.input{height:34px;padding:0 9px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;min-width:0}
.input:focus{border-color:var(--brass)}
.input.mono{font-family:var(--mono)}
.input.big{height:44px;font-size:15px;border-radius:8px;padding:0 12px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);min-width:0}
.seg{display:flex;padding:3px;gap:3px;background:var(--sunk);border:1px solid var(--line);border-radius:7px}
.seg button{flex:1;height:28px;border:none;border-radius:5px;background:transparent;color:var(--muted);font-size:13px;padding:0 8px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--brass-bg);color:var(--brass-hi);font-weight:600}
.seg.blue button[aria-pressed=true]{background:#2b3f5e;color:#cfe2ff}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:20px;border-radius:10px;background:#3a342b;position:relative;margin:0;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#a89d8b;transition:left .12s}
.switch input:checked{background:#6b5426}
.switch input:checked::after{left:17px;background:var(--brass-hi)}

/* lobby */
.lobby{position:fixed;inset:0;display:grid;place-items:center;padding:16px;overflow:auto;background:var(--bg)}
.lobby-card{width:min(880px,100%);display:grid;grid-template-columns:400px 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.lobby-hero{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding:40px;background:#0f0e0b;border-right:1px solid var(--line);min-height:560px;overflow:hidden}
.lobby-hero svg{position:absolute;left:0;top:0}
.lobby-hero>*:not(svg){position:relative}
.wordmark{font-family:var(--display);color:var(--brass-hi);letter-spacing:.02em;line-height:1}
.lobby-hero .wordmark{font-size:52px}
.lobby-hero p{margin:0;max-width:300px;line-height:1.45}
.lobby-forms{display:flex;flex-direction:column;justify-content:center;gap:20px;padding:40px}
.lobby-box{display:flex;flex-direction:column;gap:14px;padding:22px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.lobby-box h2{margin:0;font-size:18px;font-weight:600}
.lobby-box .sub{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1 1 0;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lobby-note{font-size:12px;color:var(--muted);line-height:1.4}
.lobby-status{font-size:13px;color:var(--danger);min-height:18px}
@media (max-width:820px){
  .lobby-card{grid-template-columns:1fr}
  .lobby-hero{min-height:220px;border-right:none;border-bottom:1px solid var(--line);padding:28px}
  .lobby-hero .wordmark{font-size:40px}
  .lobby-forms{padding:20px}
}

/* app shell */
.app{position:fixed;inset:0;display:grid;grid-template-columns:76px minmax(0,1fr) 320px;grid-template-rows:56px minmax(0,1fr)}
.app.nopanel{grid-template-columns:76px minmax(0,1fr) 0}
.app.nopanel .side{display:none}
.topbar{grid-column:1/4;display:flex;align-items:center;gap:14px;padding:0 12px 0 18px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.topbar .wordmark{font-size:24px}
.badge{font-size:11px;font-weight:600;letter-spacing:.12em;color:#14120f;background:var(--brass);padding:2px 7px;border-radius:3px}
.tb-center{flex:1;display:flex;justify-content:center;align-items:center;gap:10px;min-width:0}
.tb-right{display:flex;align-items:center;gap:8px}
.turnpill{height:30px;display:flex;align-items:center;padding:0 14px;border-radius:6px;font-size:13px;font-weight:600;white-space:nowrap}
.turnpill.party{background:#2b3f5e;color:#cfe2ff}
.turnpill.enemy{background:#4a2418;color:#ffcfb8}
.avatars{display:flex;align-items:center}
.avatar{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#1d1a16;border:2px solid var(--party);font-size:11px;font-weight:600;position:relative}
.avatar+.avatar{margin-left:-6px}
.avatar.off{opacity:.4}
.dot{width:8px;height:8px;border-radius:50%;background:var(--hp);display:inline-block;flex:none}
.dot.warn{background:var(--brass)}
.dot.bad{background:#d65a4a}
.conn{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--soft);white-space:nowrap}
.scene-btn{max-width:220px}
.scene-btn span{overflow:hidden;text-overflow:ellipsis}
@media (max-width:1100px){.tb-hide-md{display:none!important}}
@media (max-width:760px){.tb-hide-sm{display:none!important}.app{grid-template-columns:64px minmax(0,1fr) 0}.app .side{position:fixed;right:0;top:56px;bottom:0;width:min(340px,100%);z-index:20;box-shadow:-10px 0 30px rgba(0,0,0,.5)}.app.nopanel .side{display:none}}

.rail{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tool{width:60px;min-height:44px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:8px;border:1px solid transparent;background:transparent;color:#c9bea9;font-size:11px;padding:2px 0}
.tool:hover{background:#221e19;color:var(--text)}
.tool[aria-pressed=true]{background:var(--brass-bg);color:var(--brass-hi);border-color:var(--brass)}
.tool.toggle[aria-pressed=true]{background:transparent;border-color:transparent;color:var(--brass-hi)}
.tool.toggle[aria-pressed=true]:hover{background:#221e19}
.rail-sep{width:40px;height:1px;background:var(--line);margin:3px 0;flex:none}
.rail-fill{flex:1}

.stage{position:relative;overflow:hidden;background:#0b0a08;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud-tl{position:absolute;left:14px;top:12px;right:14px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none}
.hud-tl>*{pointer-events:auto}
.chip{padding:8px 12px;background:rgba(20,18,15,.92);border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--soft);max-width:min(620px,100%);line-height:1.35}
.toolopts{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:6px 8px 6px 12px;background:rgba(20,18,15,.92);border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--soft);max-width:100%}
.toolopts .vsep{width:1px;height:20px;background:var(--line)}
.toolopts .input{height:30px;width:58px}
.toolopts select.input{width:auto}
.toolopts .seg button{height:24px}
.hud-bl{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;flex-wrap:wrap;gap:14px;padding:9px 13px;background:rgba(20,18,15,.92);border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--soft);max-width:calc(100% - 200px)}
.hud-bl span{display:flex;align-items:center;gap:6px}
.hud-br{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:2px;padding:4px;background:rgba(20,18,15,.92);border:1px solid var(--line);border-radius:8px}
.hud-br button{width:32px;height:32px;display:grid;place-items:center;background:transparent;border:none;border-radius:6px}
.hud-br button:hover{background:var(--raised)}
.hud-br .zl{font-family:var(--mono);font-size:12px;color:var(--muted);width:46px;text-align:center}
.empty-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);font-size:14px;line-height:1.5;pointer-events:none;max-width:420px}
.empty-hint b{color:var(--soft);font-weight:600}
.empty-hint .row{justify-content:center;margin-top:12px;pointer-events:auto}

/* side panel */
.side{display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0;overflow:hidden}
.ctx{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3a342b transparent}
.sec{display:flex;flex-direction:column;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:none}
.sec-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.sec-h .btn{text-transform:none;letter-spacing:0}
.tokhead{display:flex;align-items:center;gap:10px}
.tokhead .grow{display:flex;flex-direction:column;gap:2px}
.tokname{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tokname-in{font-size:16px;font-weight:600;height:32px;background:transparent;border:1px solid transparent;border-radius:6px;padding:0 6px;margin-left:-7px;width:100%}
.tokname-in:hover{border-color:var(--line)}
.tokname-in:focus{border-color:var(--brass);background:var(--sunk)}
.side-label{font-size:12px}
.tokbadge{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:50%;background:#1d1a16 center/cover no-repeat;border:3px solid var(--party);font-size:12px;font-weight:600;overflow:hidden}
.hpline{display:flex;align-items:baseline;justify-content:space-between}
.hpline .lab{font-size:12px;color:var(--muted);letter-spacing:.06em}
.hpnum{font-family:var(--mono);font-size:16px}
.bar{height:10px;background:#0b0a08;border-radius:3px;overflow:hidden;display:flex}
.bar.thin{height:6px}
.bar.xthin{height:4px;border-radius:2px}
.bar.mv{height:3px;border-radius:2px}
.bar>div{height:100%}
.bar .hp{background:var(--hp)}
.bar .sh{background:var(--shield)}
.bar .mvf{background:var(--move)}
.bar .mvf.over{background:#d65a4a}
.small{font-size:12px;color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stchip{height:28px;padding:0 4px;border-radius:5px;border:1px solid var(--line);background:transparent;color:#b5aa97;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stchip:hover{border-color:#57503f;color:var(--text)}
.stchip.on.pos{border-color:var(--pos);background:rgba(143,192,255,.16);color:var(--pos)}
.stchip.on.neg{border-color:var(--neg);background:rgba(240,138,60,.18);color:var(--neg)}
.stchip.on.stat{border-color:var(--stat);background:rgba(205,191,159,.16);color:var(--stat)}
.stchips{display:flex;flex-wrap:wrap;gap:6px}
.stchips .stchip{height:24px;padding:0 8px;cursor:default}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:8px;height:8px;border-radius:2px;display:inline-block}
.statbox{display:flex;flex-direction:column;gap:2px;padding:8px;background:#221e19;border-radius:6px;min-width:0}
.statbox .k{font-size:11px;color:var(--muted)}
.statbox input{width:100%;background:transparent;border:none;border-bottom:1px dashed #4a443a;font-family:var(--mono);font-size:14px;padding:1px 0;border-radius:0}
.statbox input:focus{border-bottom-color:var(--brass);outline:none}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.act{height:34px;border-radius:6px;font-size:13px;font-weight:600;border:1px solid}
.act.major{border-color:var(--major);background:rgba(217,164,65,.18);color:var(--brass-hi)}
.act.minor{border-color:var(--minor);background:rgba(154,216,255,.16);color:#bfe6ff}
.act.react{border-color:var(--react);background:rgba(224,122,208,.14);color:#f0a6e4}
.act.used{border:1px dashed #4a443a;background:transparent;color:#8a8070;text-decoration:line-through;font-weight:400}
.act:disabled{opacity:1;cursor:default}
.party{display:grid;grid-template-columns:28px minmax(0,1fr) 76px 40px;align-items:center;column-gap:8px;row-gap:12px;font-size:13px}
.party .pa{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;border:2px solid var(--party);font-size:10px;font-weight:600;background:#1d1a16 center/cover no-repeat;cursor:pointer;padding:0;color:var(--text)}
.party .pn{display:flex;flex-direction:column;gap:3px;min-width:0}
.party .pn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.party .pnum{display:flex;flex-direction:column;gap:1px;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.party .pnum .mvt{color:#c7b6ff}
.pips{display:flex;gap:4px;justify-content:flex-end}
.pip{width:8px;height:8px;border-radius:50%}
.pip.major{background:var(--major)}.pip.minor{background:var(--minor)}.pip.react{background:var(--react)}
.pip.used{background:transparent;border:1px solid #5a5244}
.plist{display:flex;flex-direction:column;gap:8px}
.plist .pl{display:flex;align-items:center;gap:8px;font-size:13px}
.plist .pl .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:12px;color:var(--muted);line-height:1.4}
.kv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

.log{flex:0 0 auto;height:270px;display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px;border-top:1px solid var(--line);min-height:0}
.log ol{flex:1;min-height:0;overflow-y:auto;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13px;scrollbar-width:thin;scrollbar-color:#3a342b transparent}
.log li{display:flex;flex-direction:column;gap:2px;line-height:1.35}
.log li .who{font-weight:600}
.log li .det{font-family:var(--mono);font-size:12px;color:var(--muted)}
.log li .det b{color:var(--text);font-weight:500}
.log li.turn{color:var(--brass-hi);font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding-top:4px}
.log li.secret .who::after{content:" (secret)";color:var(--muted);font-weight:400}
.log form{display:flex;gap:6px}
.log form .input{flex:1;height:36px;font-family:var(--mono)}
.log form .btn{height:36px}
.log .secret-t{font-size:12px}
@media (max-height:760px){.log{height:230px}}

/* popover, toasts, modal */
.popover{position:absolute;z-index:5;width:200px;display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--card);border:1px solid var(--line-hi);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:50;pointer-events:none}
.toast{padding:9px 14px;background:#25211c;border:1px solid var(--line-hi);border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:tin .15s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.modal-bg{position:fixed;inset:0;background:rgba(5,4,3,.7);display:grid;place-items:center;z-index:40;padding:16px}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:18px}
.modal table{border-collapse:collapse;font-size:13px;width:100%}
.modal td{padding:5px 0;border-bottom:1px solid #2a251f;vertical-align:top}
.modal td:first-child{width:130px;color:var(--brass-hi);font-family:var(--mono);font-size:12px}
.menu{position:fixed;z-index:30;min-width:220px;background:var(--card);border:1px solid var(--line-hi);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);padding:6px;display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;background:transparent;border:none;border-radius:6px;text-align:left;font-size:13px}
.menu button:hover{background:var(--raised)}
.menu button.cur{color:var(--brass-hi)}
.menu hr{border:none;border-top:1px solid var(--line);margin:5px 2px}

</style>
</head>
<body>
<div id="lobby" class="lobby">
  <div class="lobby-card">
    <div class="lobby-hero">
      <svg width="400" height="600" viewBox="0 0 400 600" aria-hidden="true">
        <g transform="translate(-60 -40) scale(0.62)">
          <path d="M900 590 900 700 520 700 520 620 300 620 60 645 60 535 300 560 520 560 520 200 580 200 578 50 641 53 660 55 640 200 647 200 627 327 627 353 653 353 734 71 752 76 784 88 740 200 780 200 827 107 855 122 880 138 840 200 845 200 627 527 627 553 653 553 900 419 900 481 767 527 767 553 793 553 900 534 900 573Z" fill="#cbb994" opacity="0.14"/>
          <path d="M60 470H210M270 470H300M60 710H120M180 710H300M60 470V710M300 470V560M300 620V710M300 560H520M300 620H520M520 200V560M520 620V700H900M520 200H580M640 200H680M740 200H780M840 200H900M900 200V440M900 500V700M627 327h26v26h-26zM767 327h26v26h-26zM627 527h26v26h-26zM767 527h26v26h-26z" fill="none" stroke="#5a4a2e" stroke-width="3"/>
          <circle cx="585" cy="590" r="12" fill="#14120f" stroke="#7fb3ff" stroke-width="4"/>
        </g>
      </svg>
      <span class="wordmark">Lantern</span>
      <p style="font-size:16px;color:var(--soft)">A shared map with fog of war and true-distance tools for your table.</p>
      <p style="font-size:13px;color:var(--muted)">The DM's browser runs the game. Friends join with a room code. No accounts, no installs.</p>
    </div>
    <div class="lobby-forms">
      <section class="lobby-box" aria-labelledby="hostH">
        <div>
          <h2 id="hostH">Host a table</h2>
          <div class="sub">You're the DM. Keep this tab open while you play.</div>
        </div>
        <div class="row wrap">
          <button class="btn primary big grow" id="lbNew">Start a new table</button>

  async get(k) {

    catch (e) { return undefined; }

    catch (e) { return false; }
  }
};

/* ---------- host-side rules (DM applies its own and players' actions) ---------- */
function blockersFor(s) {
  return s.walls.filter((w) => w.kind === 'wall' || w.kind === 'window' || (w.kind === 'door' && !w.open));
}
function firstHit(s, x1, y1, x2, y2) {

  return best;

function walkPath(s, x0, y0, pts) {

    const L = dist(cx, cy, px, py); if (L < 1e-6) continue;
    const t = firstHit(s, cx, cy, px, py);
    if (t == null) { cx = px; cy = py; out.push([cx, cy]); continue; }
    const tt = Math.max(0, t - 0.25 / L);
    cx = cx + (px - cx) * tt; cy = cy + (py - cy) * tt; out.push([cx, cy]);

}

    for (let i = a + 1; i < b; i++) { const d = pointSeg(pts[i][0], pts[i][1], pts[a][0], pts[a][1], pts[b][0], pts[b][1]).d; if (d > md) { md = d; mi = i; } }

function cleanPatch(p, allowed) {

    else if (k === 'st') { if (v && typeof v === 'object') { const st = {}; for (const [n, c] of Object.entries(v)) if (STATUS_INFO[n] && +c > 0) st[n] = Math.min(99, Math.round(+c)); out.st = st; } }

const Rules = {
  dragStarts: {},
  // a move request from the DM (pid 'dm') or a player
  move(pid, m) {
    const s = scene(); const t = findToken(m.id, s); if (!t) return;
    if (pid !== 'dm' && !(t.owner === pid || (A.campaign.settings.anyPartyMove && t.side === 'party'))) return Host.sendTo(pid, { t: 'toast', text: "That token isn't yours to move." });
    const key = pid + ':' + m.drag;
    if (!this.dragStarts[key]) this.dragStarts[key] = { pts: [[t.x, t.y]] };
    const rec = this.dragStarts[key];
    const pts = Array.isArray(m.pts) ? m.pts.slice(0, 400) : [[m.x, m.y]];
    let res;
    if (pid === 'dm' && m.free) { const last = pts[pts.length - 1]; res = { x: last[0], y: last[1], pts: [[t.x, t.y], last] }; }
    else res = walkPath(s, t.x, t.y, pts);
    t.x = Math.round(res.x * 100) / 100; t.y = Math.round(res.y * 100) / 100;
    rec.pts.push(...res.pts.slice(1));
    if (m.final) {
      if (!m.dash) t.moved = Math.round((t.moved + pathLen(rec.pts)) * 10) / 10;
      delete this.dragStarts[key];
    }
    if (res.blocked && pid !== 'dm') Host.sendTo(pid, { t: 'blocked', id: t.id, x: t.x, y: t.y });
    changed('dyn');
  },
  tok(pid, m) {
    const t = findToken(m.id); if (!t) return;
    if (pid !== 'dm' && t.owner !== pid) return;

    changed('dyn');
  },
  door(pid, m) {

    if (pid !== 'dm') {
      if (w.locked) return Host.sendTo(pid, { t: 'toast', text: 'That door is locked.' });
      const near = s.tokens.some((t) => t.owner === pid && pointSeg(t.x, t.y, w.x1, w.y1, w.x2, w.y2).d <= 10);
      if (!near) return Host.sendTo(pid, { t: 'toast', text: 'Move one of your tokens within 10 ft of the door first.' });
    }
    w.open = !w.open; changed('geom');
  },
  tplAdd(pid, m) {
    const s = scene(); const t = m.tpl || {}; const num = (v, d) => (Number.isFinite(+v) ? +v : d);
    const kind = ['circle', 'cone', 'line'].includes(t.kind) ? t.kind : null; if (!kind) return;
    const tpl = {
      id: uid(), kind, x: num(t.x, 0), y: num(t.y, 0), x2: num(t.x2, 0), y2: num(t.y2, 0), r: clamp(num(t.r, 5), 0.5, 500),
      angle: clamp(num(t.angle, 90), 5, 360), width: clamp(num(t.width, 5), 0.5, 200), lasts: clamp(Math.round(num(t.lasts, 0)), 0, 20),
      owner: pid, side: pid === 'dm' ? (turn().side === 'enemy' ? 'enemy' : 'dm') : 'party'

    changed('dyn'); return tpl;
  },
  tplDel(pid, m) {
    const s = scene(); const i = s.templates.findIndex((t) => t.id === m.id); if (i < 0) return;
    if (pid !== 'dm' && s.templates[i].owner !== pid) return;
    s.templates.splice(i, 1); if (A.sel && A.sel.id === m.id) A.sel = null; changed('dyn');
  },
  tplClear(pid) {
    const s = scene(); const before = s.templates.length;
    s.templates = pid === 'dm' ? [] : s.templates.filter((t) => t.owner !== pid);
    if (s.templates.length !== before) changed('dyn');
  },
  roll(pid, m) {
    const r = parseRoll(m.expr); if (!r) return Host.sendTo(pid, { t: 'toast', text: 'Try a roll like 2d6+6 or 1d20 + 3.' });
    addLog({ kind: 'roll', who: pid, name: playerName(pid), color: playerColor(pid), expr: r.expr, label: r.label, detail: r.detail, total: r.total, secret: pid === 'dm' && !!m.secret });
  },
  ping(pid, m) {
    if (!Number.isFinite(+m.x) || !Number.isFinite(+m.y)) return;
    const p = { t: 'ping', x: +m.x, y: +m.y, name: playerName(pid), color: playerColor(pid) };
    Host.broadcast(p); addPing(p);
  },
  ruler(pid, m) {
    const pts = Array.isArray(m.pts) ? m.pts.slice(0, 50).filter((p) => Number.isFinite(+p[0]) && Number.isFinite(+p[1])) : null;
    const r = { t: 'ruler', from: pid, name: playerName(pid), color: playerColor(pid), pts: pts && pts.length >= 2 ? pts : null };
    Host.broadcast(r, pid); showRemoteRuler(r);
  }
};

function endTurn() {
  const c = A.campaign; const s = scene(); const ending = c.turn.side;
  for (const tpl of s.templates.slice()) {
    const mine = ending === 'party' ? tpl.side === 'party' : tpl.side !== 'party';
    if (tpl.lasts > 0 && mine) { tpl.left -= 1; if (tpl.left <= 0) s.templates.splice(s.templates.indexOf(tpl), 1); }
  }
  if (ending === 'party') c.turn.side = 'enemy'; else { c.turn.side = 'party'; c.turn.round += 1; }
  const starting = c.turn.side;
  for (const t of s.tokens) {
    const isParty = t.side === 'party';
    if ((starting === 'party') === isParty) { t.moved = 0; t.act = { major: false, minor: false, react: false }; }
  }
  addLog({ kind: 'turn', text: `Round ${c.turn.round} · ${starting === 'party' ? 'Party turn' : 'Enemy turn'}` });
  changed('dyn');
}

/* ---------- ephemeral: pings & rulers ---------- */
function addPing(p) { A.pings.push({ x: p.x, y: p.y, name: p.name, color: p.color, t0: performance.now() }); requestRender(); }
function showRemoteRuler(r) {
  if (r.from === A.me.id) return;
  if (!r.pts) { const ex = A.rulers[r.from]; if (ex) ex.fadeAt = performance.now() + 1200; requestRender(); return; }
  A.rulers[r.from] = { name: r.name, color: r.color, pts: r.pts, ts: performance.now(), fadeAt: 0 };
  requestRender();
}

/* ---------- actions (route to host or apply locally) ---------- */
const Act = {
  send(type, payload) {
    if (isDM()) { Rules[type]('dm', payload); return; }
    Client.send({ t: type, ...payload });
  },
  patchToken(t, patch) {
    if (!canControl(t)) return;
    Object.assign(t, patch); // optimistic
    if (isDM()) { changed('dyn'); } else { Client.send({ t: 'tok', id: t.id, patch }); requestRender(); UI.dirty('ctx'); }
  }
};

/* ============================================================
   Networking: peer-to-peer (PeerJS / WebRTC) with a local
   BroadcastChannel fallback for same-computer testing.
   ============================================================ */
const CHUNK = 48000;
class Wire {
  constructor(rawSend, buffered) { this.rawSend = rawSend; this.buffered = buffered || (() => 0); this.q = []; this.busy = false; this.parts = {}; }
  send(msg) {
    const s = JSON.stringify(msg);
    if (s.length <= CHUNK) this.q.push(s);
    else { const id = uid(6); const n = Math.ceil(s.length / CHUNK); for (let i = 0; i < n; i++) this.q.push(JSON.stringify({ '~c': [id, i, n, s.slice(i * CHUNK, (i + 1) * CHUNK)] })); }
    this.pump();
  }
  pump() {
    if (this.busy) return;
    while (this.q.length) {
      let b = 0; try { b = this.buffered(); } catch (e) { b = 0; }
      if (b > 1.5e6) { this.busy = true; setTimeout(() => { this.busy = false; this.pump(); }, 30); return; }
      try { this.rawSend(this.q.shift()); } catch (e) { this.q.length = 0; return; }
    }
  }
  receive(raw) {
    let m; try { m = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { return null; }
    if (m && m['~c']) {
      const [id, i, n, part] = m['~c'];
      const p = this.parts[id] || (this.parts[id] = { n, got: 0, arr: new Array(n) });
      if (p.arr[i] == null) { p.arr[i] = part; p.got++; }
      if (p.got === p.n) { delete this.parts[id]; try { return JSON.parse(p.arr.join('')); } catch (e) { return null; } }
      return null;
    }
    return m;
  }
}

function peerOptions() {
  const o = { debug: 1, config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }] } };
  const q = new URLSearchParams(location.search);
  if (q.get('peerhost')) { o.host = q.get('peerhost'); o.port = +(q.get('peerport') || 9000); o.path = q.get('peerpath') || '/'; o.secure = q.get('peersecure') === '1'; }
  const turn = LS.get('turn', null);
  if (turn && turn.urls) o.config.iceServers.push({ urls: turn.urls, username: turn.username || undefined, credential: turn.credential || undefined });
  return o;
}
const FATAL = ['network', 'server-error', 'socket-error', 'socket-closed', 'ssl-unavailable'];

const PeerHost = {
  conns: {},
  start(code, h) { this.h = h; this.code = code; this.stopped = false; this.create(); },
  create() {
    if (this.stopped) return;
    if (typeof Peer === 'undefined') { this.h.status('nolib'); return; }
    if (this.peer) { try { this.peer.destroy(); } catch (e) { /* */ } }
    const peer = this.peer = new Peer(PEER_PREFIX + this.code.toLowerCase(), peerOptions());
    this.h.status('connecting');
    peer.on('open', () => this.h.status('online'));
    peer.on('connection', (conn) => {
      const cid = uid();
      const wire = new Wire((s) => conn.send(s), () => (conn.dataChannel ? conn.dataChannel.bufferedAmount : 0));
      this.conns[cid] = { conn, wire };
      conn.on('open', () => this.h.connect(cid));
      conn.on('data', (d) => { const m = wire.receive(d); if (m) this.h.message(cid, m); });
      const gone = () => { if (this.conns[cid]) { delete this.conns[cid]; this.h.disconnect(cid); } };
      conn.on('close', gone); conn.on('error', gone);
    });
    peer.on('disconnected', () => {
      if (peer.destroyed || this.stopped) return;
      this.h.status('reconnecting');
      setTimeout(() => { if (!peer.destroyed && peer.disconnected) { try { peer.reconnect(); } catch (e) { this.retry(3000); } } }, 1500);
    });
    peer.on('error', (err) => {
      if (this.stopped) return;
      if (err.type === 'unavailable-id') { this.h.status('taken'); this.retry(4000); }
      else if (FATAL.includes(err.type)) { this.h.status('offline'); this.retry(5000); }
      else if (err.type === 'browser-incompatible') this.h.status('nolib');
    });
  },
  retry(ms) { clearTimeout(this.rt); this.rt = setTimeout(() => this.create(), ms); },
  send(cid, msg) { const c = this.conns[cid]; if (c) c.wire.send(msg); },
  close(cid) { const c = this.conns[cid]; if (c) { try { c.conn.close(); } catch (e) { /* */ } } },
  stop() { this.stopped = true; clearTimeout(this.rt); for (const c of Object.values(this.conns)) { try { c.conn.close(); } catch (e) { /* */ } } this.conns = {}; if (this.peer) { try { this.peer.destroy(); } catch (e) { /* */ } } }
};

const PeerClient = {
  start(code, h) { this.h = h; this.code = code; this.stopped = false; this.createPeer(); },
  later(ms, fn) { clearTimeout(this.lt); this.lt = setTimeout(fn, ms); },
  createPeer() {
    if (this.stopped) return;
    if (typeof Peer === 'undefined') { this.h.status('nolib'); return; }
    if (this.peer) { try { this.peer.destroy(); } catch (e) { /* */ } }
    const peer = this.peer = new Peer(peerOptions());
    this.h.status('connecting');
    peer.on('open', () => this.connect());
    peer.on('disconnected', () => { if (!peer.destroyed && !this.stopped) setTimeout(() => { if (!peer.destroyed && peer.disconnected) { try { peer.reconnect(); } catch (e) { /* */ } } }, 1500); });
    peer.on('error', (err) => {
      if (this.stopped) return;
      if (err.type === 'peer-unavailable') { this.h.status('nohost'); this.later(3000, () => this.connect()); }
      else if (FATAL.includes(err.type)) { this.h.status('offline'); this.later(4000, () => this.createPeer()); }
      else if (err.type === 'browser-incompatible') this.h.status('nolib');
    });
  },
  connect() {
    if (this.stopped) return;
    if (!this.peer || this.peer.destroyed) return this.createPeer();
    if (this.peer.disconnected || !this.peer.open) { this.later(1500, () => this.connect()); return; }
    if (this.conn) { const old = this.conn; this.conn = null; try { old.close(); } catch (e) { /* */ } }
    this.h.status('connecting');
    const conn = this.conn = this.peer.connect(PEER_PREFIX + this.code.toLowerCase(), { serialization: 'raw', reliable: true });
    const wire = this.wire = new Wire((s) => conn.send(s), () => (conn.dataChannel ? conn.dataChannel.bufferedAmount : 0));
    const to = setTimeout(() => { if (this.conn === conn && !conn.open) { this.h.status('nohost'); this.later(1000, () => this.connect()); } }, 15000);
    conn.on('open', () => { clearTimeout(to); if (this.conn === conn) this.h.open(); });
    conn.on('data', (d) => { if (this.conn !== conn) return; const m = wire.receive(d); if (m) this.h.message(m); });
    conn.on('close', () => { clearTimeout(to); if (this.conn === conn) { this.conn = null; this.h.close(); if (!this.stopped) this.later(1500, () => this.connect()); } });
    conn.on('error', () => { /* close handles it */ });
  },
  send(msg) { if (this.conn && this.conn.open) this.wire.send(msg); },
  drop() { if (this.conn) { const c = this.conn; this.conn = null; try { c.close(); } catch (e) { /* */ } this.h.close(); this.later(500, () => this.connect()); } },
  stop() { this.stopped = true; clearTimeout(this.lt); if (this.conn) { try { this.conn.close(); } catch (e) { /* */ } } if (this.peer) { try { this.peer.destroy(); } catch (e) { /* */ } } }
};

/* same-computer mode (?local): tabs talk over BroadcastChannel */
const LocalHost = {
  conns: {},
  start(code, h) {
    this.h = h; this.bc = new BroadcastChannel('lantern-local-' + code);
    this.bc.onmessage = (e) => {
      const d = e.data; if (!d || d.to !== 'host') return;
      if (d.k === 'open') { if (this.conns[d.from]) h.disconnect(d.from); this.conns[d.from] = true; this.bc.postMessage({ to: d.from, k: 'open' }); h.connect(d.from); }
      else if (d.k === 'data' && this.conns[d.from]) { try { h.message(d.from, JSON.parse(d.s)); } catch (err) { /* */ } }
      else if (d.k === 'close' && this.conns[d.from]) { delete this.conns[d.from]; h.disconnect(d.from); }
    };
    h.status('online');
  },
  send(cid, msg) { if (this.conns[cid]) this.bc.postMessage({ to: cid, k: 'data', s: JSON.stringify(msg) }); },
  close(cid) { if (this.conns[cid]) { delete this.conns[cid]; this.bc.postMessage({ to: cid, k: 'close' }); this.h.disconnect(cid); } },
  stop() { for (const cid of Object.keys(this.conns)) this.bc.postMessage({ to: cid, k: 'close' }); this.conns = {}; if (this.bc) this.bc.close(); }
};
const LocalClient = {
  start(code, h) {
    this.h = h; this.id = uid(); this.isOpen = false; this.stopped = false; this.bc = new BroadcastChannel('lantern-local-' + code);
    this.bc.onmessage = (e) => {
      const d = e.data; if (!d || d.to !== this.id) return;
      if (d.k === 'open') { this.isOpen = true; clearTimeout(this.rt); h.open(); }
      else if (d.k === 'data' && this.isOpen) { try { h.message(JSON.parse(d.s)); } catch (err) { /* */ } }
      else if (d.k === 'close') { this.isOpen = false; h.close(); this.connect(); }
    };
    window.addEventListener('beforeunload', () => { try { this.bc.postMessage({ to: 'host', from: this.id, k: 'close' }); } catch (e) { /* */ } });
    this.connect();
  },
  connect() {
    if (this.stopped) return;
    this.h.status('connecting');
    this.bc.postMessage({ to: 'host', from: this.id, k: 'open' });
    clearTimeout(this.rt); this.rt = setTimeout(() => { if (!this.isOpen) { this.h.status('nohost'); this.connect(); } }, 2500);
  },
  send(msg) { if (this.isOpen) this.bc.postMessage({ to: 'host', from: this.id, k: 'data', s: JSON.stringify(msg) }); },
  drop() { this.isOpen = false; this.h.close(); this.connect(); },
  stop() { this.stopped = true; clearTimeout(this.rt); try { this.bc.postMessage({ to: 'host', from: this.id, k: 'close' }); } catch (e) { /* */ } this.bc.close(); }
};

/* ---------------- DM side ---------------- */
const Host = {
  net: null, clients: {}, timer: null,
  start(code) {
    this.net = A.local ? LocalHost : PeerHost;
    this.net.start(code, {
      status: (s) => { A.conn = s; UI.dirty('top'); },
      connect: (cid) => { this.clients[cid] = { cid, pid: null, geom: -1, scene: null, dyn: -1, assets: new Set(), seen: Date.now() }; },
      message: (cid, m) => this.onMessage(cid, m),
      disconnect: (cid) => this.onDisconnect(cid)
    });
    clearInterval(this.hb);
    this.hb = setInterval(() => this.heartbeat(), 4000);
  },
  stop() { clearInterval(this.hb); if (this.net) this.net.stop(); this.clients = {}; },
  heartbeat() {
    const now = Date.now();
    for (const c of Object.values(this.clients)) {
      if (now - c.seen > 16000) { this.net.close(c.cid); continue; }
      this.net.send(c.cid, { t: 'hb' });
    }
    const s = scene();
    if (s && Fog.dirtySync[s.id]) {
      Fog.dirtySync[s.id] = false; const f = Fog.get(s, false);
      if (f) this.broadcast({ t: 'explored', sceneId: s.id, data: f.cv.toDataURL('image/png'), reset: false });
    }
  },
  pidOnline(pid) { return Object.values(this.clients).some((c) => c.pid === pid); },
  onMessage(cid, m) {
    const c = this.clients[cid]; if (!c || !m || typeof m.t !== 'string') return;
    c.seen = Date.now();
    if (m.t === 'hb') return;
    if (m.t === 'bye') { this.net.close(cid); if (this.clients[cid]) this.onDisconnect(cid); return; }
    if (m.t === 'hello') return this.hello(c, m);
    if (!c.pid) return;
    const pid = c.pid;
    switch (m.t) {
      case 'move': return Rules.move(pid, m);
      case 'tok': return Rules.tok(pid, m);
      case 'door': return Rules.door(pid, m);
      case 'tplAdd': return Rules.tplAdd(pid, m);
      case 'tplDel': return Rules.tplDel(pid, m);
      case 'tplClear': return Rules.tplClear(pid, m);
      case 'roll': return Rules.roll(pid, m);
      case 'ping': return Rules.ping(pid, m);
      case 'ruler': return Rules.ruler(pid, m);
      default: return undefined;
    }
  },
  hello(c, m) {
    let pid = String(m.pid || '').replace(/[^a-z0-9]/gi, '').slice(0, 24) || uid();
    const name = String(m.name || '').trim().slice(0, 24) || 'Player';
    const P = A.campaign.players;
    if (!P[pid]) {
      const match = Object.entries(P).find(([id, p]) => p.name.toLowerCase() === name.toLowerCase() && !this.pidOnline(id));
      if (match) pid = match[0];
      else P[pid] = { name, color: PLAYER_COLORS[Object.keys(P).length % PLAYER_COLORS.length] };
    }
    const wasOnline = this.pidOnline(pid);
    P[pid].name = name; c.pid = pid; c.geom = -1; c.scene = null; c.dyn = -1;
    this.net.send(c.cid, { t: 'welcome', pid, color: P[pid].color, name, campaign: A.campaign.name, version: APP_VERSION });
    this.net.send(c.cid, { t: 'logAll', entries: A.log.filter((e) => !e.secret).slice(-150) });
    if (!wasOnline) addLog({ kind: 'info', text: `${name} joined the table` });
    changed('dyn'); UI.dirty('top', 'ctx');
  },
  onDisconnect(cid) {
    const c = this.clients[cid]; delete this.clients[cid];
    if (c && c.pid && !this.pidOnline(c.pid)) {
      addLog({ kind: 'info', text: `${playerName(c.pid)} left the table` });
      for (const k of Object.keys(A.rulers)) if (k === c.pid) delete A.rulers[k];
      changed('dyn');
    }
    UI.dirty('top', 'ctx');
  },
  schedule() { if (this.timer || !this.net) return; this.timer = setTimeout(() => { this.timer = null; this.flush(); }, 50); },
  flush() { if (!A.campaign) return; for (const c of Object.values(this.clients)) if (c.pid) this.flushClient(c); },
  playersView() {
    const out = {};
    for (const [id, p] of Object.entries(A.campaign.players)) out[id] = { name: p.name, color: p.color, online: this.pidOnline(id) };
    return out;
  },
  sendAssets(c, ids) {
    for (const id of ids) { if (!id || c.assets.has(id) || !A.assets[id]) continue; c.assets.add(id); this.net.send(c.cid, { t: 'asset', id, mime: A.assets[id].mime, data: A.assets[id].data }); }
  },
  flushClient(c) {
    const s = scene(); if (!s) return;
    if (c.scene !== s.id || c.geom !== A.geomVer) {
      const sceneChanged = c.scene !== s.id;
      this.sendAssets(c, s.images.map((i) => i.asset));
      this.net.send(c.cid, { t: 'geom', ver: A.geomVer, scene: { id: s.id, name: s.name, w: s.w, h: s.h, drawWalls: s.drawWalls, images: s.images, floors: s.floors, walls: s.walls } });
      if (sceneChanged) { const f = Fog.get(s, false); this.net.send(c.cid, { t: 'explored', sceneId: s.id, data: f ? f.cv.toDataURL('image/png') : null, reset: true }); }
      c.scene = s.id; c.geom = A.geomVer; c.dyn = -1;
    }
    if (c.dyn !== A.dynVer) {
      const toks = Vision.playerTokens(s);
      this.sendAssets(c, toks.map((t) => t.img));
      this.net.send(c.cid, { t: 'dyn', sceneId: s.id, tokens: toks, templates: s.templates, turn: A.campaign.turn, players: this.playersView(), settings: A.campaign.settings, campaign: A.campaign.name });
      c.dyn = A.dynVer;
    }
  },
  sendTo(pid, msg) { if (!this.net) return; for (const c of Object.values(this.clients)) if (c.pid === pid) this.net.send(c.cid, msg); },
  broadcast(msg, exceptPid) { if (!this.net) return; for (const c of Object.values(this.clients)) if (c.pid && c.pid !== exceptPid) this.net.send(c.cid, msg); }
};

/* ---------------- player side ---------------- */
const Client = {
  net: null, lastMsg: 0, welcomed: false,
  start(code, name) {
    this.code = code; this.name = name; this.welcomed = false;
    A.view = { scene: null, turn: { round: 1, side: 'party' }, players: {}, settings: { enemyHp: true }, campaign: '', geomVer: 1 };
    this.net = A.local ? LocalClient : PeerClient;
    this.net.start(code, {
      status: (s) => { if (A.conn !== 'online' || s === 'online') { A.conn = s; UI.dirty('top'); Lobby.clientStatus(s); } },
      open: () => { this.lastMsg = Date.now(); this.net.send({ t: 'hello', pid: A.me.id, name: this.name }); },
      message: (m) => { this.lastMsg = Date.now(); this.onMessage(m); },
      close: () => { A.conn = 'reconnecting'; UI.dirty('top'); }
    });
    window.addEventListener('beforeunload', () => { try { this.net.send({ t: 'bye' }); } catch (e) { /* */ } });
    clearInterval(this.hb);
    this.hb = setInterval(() => {
      if (A.conn !== 'online') return;
      this.net.send({ t: 'hb' });
      if (Date.now() - this.lastMsg > 16000) { A.conn = 'reconnecting'; UI.dirty('top'); this.net.drop(); }
    }, 4000);
  },
  stop() { clearInterval(this.hb); if (this.net) this.net.stop(); this.net = null; },
  send(m) { if (this.net) this.net.send(m); },
  onMessage(m) {
    const v = A.view;
    switch (m.t) {
      case 'welcome':
        A.me.id = m.pid; A.me.color = m.color; A.me.name = m.name; v.campaign = m.campaign;
        try { sessionStorage.setItem('lantern.pid', m.pid); } catch (e) { /* */ }
        LS.set('pid', m.pid);
        A.conn = 'online';
        if (!this.welcomed) { this.welcomed = true; Lobby.enterApp(); }
        UI.dirty('top', 'ctx');
        break;
      case 'geom': {
        const old = v.scene;
        if (!old || old.id !== m.scene.id) {
          v.scene = Object.assign({ tokens: [], templates: [] }, m.scene);
          A.sel = null; A.rulers = {}; A.chain = null;
          Stage.fit();
        } else Object.assign(old, m.scene);
        v.geomVer++; Vision.invalidate(); requestRender(); UI.dirty('ctx', 'top');
        break;
      }
      case 'dyn': {
        if (!v.scene || v.scene.id !== m.sceneId) break;
        const d = A.drag && A.drag.mode === 'token' ? A.drag : null;
        v.scene.tokens = m.tokens; v.scene.templates = m.templates;
        if (d) { const t = v.scene.tokens.find((x) => x.id === d.id); if (t) { t.x = d.cur[0]; t.y = d.cur[1]; } }
        v.turn = m.turn; v.players = m.players; v.settings = m.settings; v.campaign = m.campaign;
        if (A.sel && !selectedObj()) A.sel = null;
        Vision.invalidate(); requestRender(); UI.dirty('ctx', 'top');
        break;
      }
      case 'blocked': {
        if (A.drag && A.drag.mode === 'token' && A.drag.id === m.id) { A.drag = null; toast('Blocked by a wall'); }
        const t = findToken(m.id); if (t) { t.x = m.x; t.y = m.y; Vision.invalidate(); requestRender(); }
        break;

        const L = dist(w.x1, w.y1, w.x2, w.y2), a = Math.atan2(w.y2 - w.y1, w.x2 - w.x1) + 70 * Math.PI / 180;
        const ex = w.x1 + Math.cos(a) * L, ey = w.y1 + Math.sin(a) * L;
        g.strokeStyle = '#8a5a2b'; g.lineCap = 'round'; g.lineWidth = Math.max(0.5, 3 * px); g.beginPath(); g.moveTo(w.x1, w.y1); g.lineTo(ex, ey); g.stroke();
        g.strokeStyle = 'rgba(43,36,27,.8)'; g.lineWidth = Math.max(0.12, 1 * px); g.setLineDash([3 * px, 4 * px]);
        g.beginPath(); g.arc(w.x1, w.y1, L, a, a - 70 * Math.PI / 180, true); g.stroke(); g.setLineDash([]);
      }
    }
  }
  g.lineCap = 'butt';
}

function drawWallOverlay(g, s, z, strong) {
  const px = 1 / z;
  g.save(); g.lineCap = 'round';
  g.globalAlpha = strong ? 1 : 0.55;
  g.strokeStyle = '#efe3c6'; g.lineWidth = (strong ? 2.5 : 1.5) * px; g.beginPath();
  for (const w of s.walls) if (w.kind === 'wall') { g.moveTo(w.x1, w.y1); g.lineTo(w.x2, w.y2); }
  g.stroke();
  g.strokeStyle = '#6fd3e0'; g.lineWidth = 3 * px; g.setLineDash([7 * px, 5 * px]); g.beginPath();
  for (const w of s.walls) if (w.kind === 'window') { g.moveTo(w.x1, w.y1); g.lineTo(w.x2, w.y2); }
  g.stroke();
  g.strokeStyle = '#e0a63e'; g.setLineDash([2 * px, 5 * px]); g.beginPath();
  for (const w of s.walls) if (w.kind === 'door' && w.open) { g.moveTo(w.x1, w.y1); g.lineTo(w.x2, w.y2); }
  g.stroke(); g.setLineDash([]);
  g.lineWidth = 4 * px; g.beginPath();
  for (const w of s.walls) if (w.kind === 'door' && !w.open) { g.moveTo(w.x1, w.y1); g.lineTo(w.x2, w.y2); }
  g.stroke();
  if (strong) {
    g.fillStyle = '#efe3c6';
    for (const w of s.walls) for (const [x, y] of [[w.x1, w.y1], [w.x2, w.y2]]) { g.beginPath(); g.arc(x, y, 2.6 * px, 0, Math.PI * 2); g.fill(); }
  }

}

function drawSnapDots(g, s, z) {
  const st = A.opts.snap; const [x0, y0] = Stage.s2w(0, 0), [x1, y1] = Stage.s2w(Stage.W, Stage.H);
  const ax = Math.max(Math.floor(x0 / st) * st, -st * 40), bx = x1, ay = Math.floor(y0 / st) * st, by = y1;
  if ((bx - ax) / st * (by - ay) / st > 40000) return;
  g.fillStyle = 'rgba(239,227,198,.22)'; const r = 1.1 / z;
  for (let x = ax; x <= bx; x += st) for (let y = ay; y <= by; y += st) g.fillRect(x - r, y - r, r * 2, r * 2);
}

function drawFog(g, s, polys, alpha) {
  const fg = Stage.fg, W = Stage.W, H = Stage.H, z = A.cam.z, k = FOG_SCALE;
  const fw = Stage.fogCv.width, fh = Stage.fogCv.height;
  fg.setTransform(1, 0, 0, 1, 0, 0); fg.globalCompositeOperation = 'source-over'; fg.globalAlpha = 1;
  fg.clearRect(0, 0, fw, fh); fg.fillStyle = '#0b0a08'; fg.fillRect(0, 0, fw, fh);
  fg.setTransform(z * k, 0, 0, z * k, (W / 2 - A.cam.x * z) * k, (H / 2 - A.cam.y * z) * k);
  fg.globalCompositeOperation = 'destination-out';
  const f = Fog.get(s, false);
  if (f) { fg.globalAlpha = 0.5; fg.imageSmoothingEnabled = true; fg.drawImage(f.cv, 0, 0, s.w, s.h); }
  fg.globalAlpha = 1; fg.fillStyle = '#000';
  for (const p of polys) {
    fg.save();
    if (Number.isFinite(p.r)) { fg.beginPath(); fg.arc(p.x, p.y, p.r, 0, Math.PI * 2); fg.clip(); }
    fillFlatPoly(fg, p.poly); fg.restore();
  }
  fg.globalCompositeOperation = 'source-over';
  screenT(g); g.globalAlpha = alpha; g.imageSmoothingEnabled = true;
  g.drawImage(Stage.fogCv, 0, 0, fw / k, fh / k);
  g.globalAlpha = 1;
}

function drawTemplate(g, t, z, col, sel, count) {
  const px = 1 / z;
  g.save(); g.fillStyle = hexA(col, sel ? 0.2 : 0.13); g.strokeStyle = col; g.lineWidth = (sel ? 2.5 : 2) * px; g.setLineDash([8 * px, 6 * px]);
  g.beginPath();
  let lx = t.x, ly = t.y;
  if (t.kind === 'circle') { g.arc(t.x, t.y, Math.max(0.01, t.r), 0, Math.PI * 2); lx = t.x; ly = t.y - t.r; }
  else if (t.kind === 'cone') {
    const len = dist(t.x, t.y, t.x2, t.y2), a0 = Math.atan2(t.y2 - t.y, t.x2 - t.x), h = t.angle * Math.PI / 360;
    g.moveTo(t.x, t.y); g.arc(t.x, t.y, Math.max(0.01, len), a0 - h, a0 + h); g.closePath(); lx = t.x2; ly = t.y2;
  } else {
    const len = dist(t.x, t.y, t.x2, t.y2) || 0.001, nx = -(t.y2 - t.y) / len * t.width / 2, ny = (t.x2 - t.x) / len * t.width / 2;
    g.moveTo(t.x + nx, t.y + ny); g.lineTo(t.x2 + nx, t.y2 + ny); g.lineTo(t.x2 - nx, t.y2 - ny); g.lineTo(t.x - nx, t.y - ny); g.closePath(); lx = t.x2; ly = t.y2;
  }
  g.fill(); g.stroke(); g.setLineDash([]);
  g.strokeStyle = col; g.lineWidth = 2 * px; g.beginPath(); g.moveTo(t.x - 5 * px, t.y); g.lineTo(t.x + 5 * px, t.y); g.moveTo(t.x, t.y - 5 * px); g.lineTo(t.x, t.y + 5 * px); g.stroke();
  g.restore();
  let txt = tplLabel(t);
  if (count) txt += ` · ${count} inside`;
  if (t.lasts > 0) txt += ` · ${t.left ?? t.lasts} turn${(t.left ?? t.lasts) === 1 ? '' : 's'}`;
  return { x: lx, y: ly, text: txt, o: { align: 'center', dy: t.kind === 'circle' ? -14 : -16, color: '#ffe2cf', border: hexA(col, 0.8) } };
}

function drawToken(g, t, z, o) {
  const px = 1 / z; const r = Math.max((t.size || 5) / 2, 3 * px);
  const col = SIDE_COLOR[t.side] || '#cdbf9f';
  g.save();
  if (o.ghost) g.globalAlpha = 0.35; else if (o.dashed) g.globalAlpha = 0.8;
  if (o.hit) { g.strokeStyle = '#f08a3c'; g.lineWidth = 3 * px; g.globalAlpha *= 0.85; g.beginPath(); g.arc(t.x, t.y, r + 4 * px, 0, Math.PI * 2); g.stroke(); g.globalAlpha = o.dashed ? 0.8 : 1; }
  if (o.mine) { g.strokeStyle = hexA(col, 0.55); g.lineWidth = 1.5 * px; g.beginPath(); g.arc(t.x, t.y, r + 4.5 * px, 0, Math.PI * 2); g.stroke(); }
  g.beginPath(); g.arc(t.x, t.y, r, 0, Math.PI * 2); g.fillStyle = '#1d1a16'; g.fill();
  const img = getImg(t.img);
  if (img) { g.save(); g.beginPath(); g.arc(t.x, t.y, r, 0, Math.PI * 2); g.clip(); g.drawImage(img, t.x - r, t.y - r, r * 2, r * 2); g.restore(); }
  else {
    g.fillStyle = '#ece4d6'; g.font = `600 ${r * 0.78}px 'IBM Plex Sans Condensed', sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(initials(t.name), t.x, t.y + r * 0.05);
  }
  const lw = Math.max(r * 0.14, 2.5 * px);
  g.lineWidth = lw; g.strokeStyle = col; if (o.dashed) g.setLineDash([4 * px, 3 * px]);
  g.beginPath(); g.arc(t.x, t.y, r - lw / 2, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
  // hp bar
  if (t.maxHp > 0 && t.hp != null) {
    const bw = Math.max(r * 2.2, 26 * px), bh = Math.max(r * 0.16, 3.5 * px), bx = t.x - bw / 2, by = t.y + r + Math.max(r * 0.12, 2.5 * px);
    g.fillStyle = 'rgba(11,10,8,.85)'; g.fillRect(bx, by, bw, bh);
    const hf = clamp(t.hp / t.maxHp, 0, 1); g.fillStyle = '#79c27d'; g.fillRect(bx, by, bw * hf, bh);
    if (t.shield > 0) { const sf = Math.min(t.shield / t.maxHp, 1 - hf); g.fillStyle = '#ddd6c6'; g.fillRect(bx + bw * hf, by, bw * Math.max(sf, 0.04), bh); }
  }
  // status badges
  const st = Object.keys(t.st || {}).filter((n) => STATUS_INFO[n]);
  if (st.length) {
    const br = Math.max(r * 0.3, 5.5 * px); const ang = [-45, -135, 0, 180, -90].map((d) => d * Math.PI / 180);
    const max = st.length > 5 ? 4 : st.length;
    for (let i = 0; i < Math.min(5, st.length); i++) {
      const bx = t.x + Math.cos(ang[i]) * r * 0.95, by = t.y + Math.sin(ang[i]) * r * 0.95;
      const more = i === 4 && st.length > 5;
      const info = more ? null : STATUS_INFO[st[i]];
      g.beginPath(); g.arc(bx, by, br, 0, Math.PI * 2); g.fillStyle = more ? '#ece4d6' : KIND_COLOR[info.kind]; g.fill();
      g.lineWidth = 1.5 * px; g.strokeStyle = '#14120f'; g.stroke();
      g.fillStyle = '#14120f'; g.font = `700 ${br * 0.95}px 'IBM Plex Sans Condensed', sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(more ? `+${st.length - max}` : info.abbr, bx, by + br * 0.06);
    }
  }
  if (o.hiddenFlag) {
    const bx = t.x - r * 0.95, by = t.y + r * 0.6, br = Math.max(r * 0.3, 6 * px);
    g.beginPath(); g.arc(bx, by, br, 0, Math.PI * 2); g.fillStyle = '#14120f'; g.fill(); g.strokeStyle = '#a89d8b'; g.lineWidth = 1.2 * px; g.stroke();
    g.beginPath(); g.moveTo(bx - br * 0.55, by - br * 0.55); g.lineTo(bx + br * 0.55, by + br * 0.55); g.stroke();
  }
  if (o.sel) { g.strokeStyle = '#f1c46b'; g.lineWidth = 2 * px; g.setLineDash([4 * px, 3 * px]); g.beginPath(); g.arc(t.x, t.y, r + 6 * px, 0, Math.PI * 2); g.stroke(); g.setLineDash([]); }
  g.restore();
  if (o.sel || o.hover) drawLabel(g, t.x, t.y - r, t.name, { align: 'center', dy: -16, mono: false, size: 12, weight: 600 });
}

function drawSelection(g, s, z) {
  const px = 1 / z; const o = selectedObj(); if (!o) return;
  g.save();
  if (A.sel.type === 'wall') {
    g.strokeStyle = 'rgba(241,196,107,.35)'; g.lineWidth = 9 * px; g.lineCap = 'round'; g.beginPath(); g.moveTo(o.x1, o.y1); g.lineTo(o.x2, o.y2); g.stroke();
    g.fillStyle = '#f1c46b'; g.strokeStyle = '#14120f'; g.lineWidth = 1.5 * px;
    for (const [x, y] of [[o.x1, o.y1], [o.x2, o.y2]]) { g.beginPath(); g.rect(x - 5 * px, y - 5 * px, 10 * px, 10 * px); g.fill(); g.stroke(); }
    drawLabel(g, (o.x1 + o.x2) / 2, (o.y1 + o.y2) / 2, fmtFt1(dist(o.x1, o.y1, o.x2, o.y2)), { align: 'center', dy: -18 });
  } else if (A.sel.type === 'image') {
    g.strokeStyle = '#f1c46b'; g.lineWidth = 1.5 * px; g.setLineDash([6 * px, 4 * px]); g.strokeRect(o.x, o.y, o.w, o.h); g.setLineDash([]);
    if (!o.locked) { g.fillStyle = '#f1c46b'; g.fillRect(o.x + o.w - 6 * px, o.y + o.h - 6 * px, 12 * px, 12 * px); }
  } else if (A.sel.type === 'floor') {
    g.strokeStyle = '#f1c46b'; g.lineWidth = 2 * px; g.setLineDash([6 * px, 4 * px]); polyPath(g, o.pts); g.stroke(); g.setLineDash([]);
  }
  g.restore();
}

function drawDragInfo(g, s, z) {
  const d = A.drag; const t = findToken(d.id); if (!t) return;
  const px = 1 / z;
  drawToken(g, { ...t, x: d.start[0], y: d.start[1], st: {} }, z, { ghost: true });
  const pts = d.path.concat([d.cur]);
  g.save(); g.strokeStyle = 'rgba(20,18,15,.9)'; g.lineWidth = 6 * px; g.lineCap = 'round'; g.lineJoin = 'round';
  const sp = simplify(pts, 1); polyPathOpen(g, sp); g.stroke();
  g.strokeStyle = d.dash ? '#9ad8ff' : '#a98bff'; g.lineWidth = 3 * px; g.setLineDash([9 * px, 6 * px]); polyPathOpen(g, sp); g.stroke(); g.restore();
  const L = pathLen(pts);
  let txt;
  if (d.dash) txt = `Dash ${fmtFt1(L)} (free)`;
  else { const tot = (t.moved || 0) + L; txt = `${fmtFt1(L)} · ${round1(tot)}/${t.speed || 0} ft`; }
  const over = !d.dash && (t.moved || 0) + L > (t.speed || 0) + 0.05;
  drawLabel(g, d.cur[0], d.cur[1], txt, { dx: 18, dy: -22, color: over ? '#ffb4a6' : '#e5dbff', border: over ? '#8a3b2e' : '#5b4a8f' });
}
function polyPathOpen(g, pts) { g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); }

function drawRuler(g, pts, col, name, z, alpha) {
  if (!pts || pts.length < 2) return;
  const px = 1 / z;
  g.save(); g.globalAlpha = alpha; g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = 'rgba(20,18,15,.9)'; g.lineWidth = 6 * px; polyPathOpen(g, pts); g.stroke();
  g.strokeStyle = col; g.lineWidth = 3 * px; g.setLineDash([10 * px, 6 * px]); polyPathOpen(g, pts); g.stroke(); g.setLineDash([]);
  g.fillStyle = col; for (const p of pts) { g.beginPath(); g.arc(p[0], p[1], 3.5 * px, 0, Math.PI * 2); g.fill(); }
  g.restore();
  let L = 0; for (let i = 1; i < pts.length; i++) L += dist(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]);
  const last = pts[pts.length - 1];
  const seg = pts.length > 2 ? ` (${fmtFt1(dist(pts[pts.length - 2][0], pts[pts.length - 2][1], last[0], last[1]))})` : '';
  drawLabel(g, last[0], last[1], (name ? name + ' · ' : '') + fmtFt1(L) + seg, { dx: 14, dy: -18, color: col, border: hexA(col, 0.7), alpha });
}

function drawPing(g, p, now) {
  const t = clamp((now - p.t0) / 900, 0, 1); const [sx, sy] = Stage.w2s(p.x, p.y);
  g.save(); screenT(g);
  const a = 1 - t;
  g.strokeStyle = p.color; g.globalAlpha = a; g.lineWidth = 3;
  g.beginPath(); g.arc(sx, sy, 8 + 38 * t, 0, Math.PI * 2); g.stroke();
  g.globalAlpha = a * 0.5; g.lineWidth = 2; g.beginPath(); g.arc(sx, sy, 4 + 22 * t, 0, Math.PI * 2); g.stroke();
  g.globalAlpha = a; g.fillStyle = p.color; g.beginPath(); g.arc(sx, sy, 4, 0, Math.PI * 2); g.fill();
  g.restore();
  drawLabel(g, p.x, p.y, p.name, { dx: 16, dy: -20, mono: false, weight: 600, pill: true, bg: '#1d2738', border: hexA(p.color, 0.8), color: '#e6efff', alpha: a });
}

function drawBuildPreview(g, s, z) {
  const px = 1 / z; const m = A.mouseW;
  g.save();
  if (A.snapHit) { g.strokeStyle = '#f1c46b'; g.lineWidth = 2 * px; g.beginPath(); g.arc(A.snapHit[0], A.snapHit[1], 6 * px, 0, Math.PI * 2); g.stroke(); }
  if (A.chain && A.chain.pts.length && m) {
    const kind = A.chain.kind; const pts = A.chain.pts; const last = pts[pts.length - 1]; const cur = A.chainCur || m;
    const col = kind === 'window' ? '#6fd3e0' : kind === 'floor' ? '#f1c46b' : '#efe3c6';
    g.strokeStyle = col; g.lineWidth = 2.5 * px; g.lineCap = 'round';
    if (kind === 'floor') { g.fillStyle = 'rgba(241,196,107,.12)'; polyPath(g, pts.concat([cur])); g.fill(); }
    g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.stroke();
    g.setLineDash([6 * px, 5 * px]); g.beginPath(); g.moveTo(last[0], last[1]); g.lineTo(cur[0], cur[1]); g.stroke(); g.setLineDash([]);
    g.fillStyle = col; for (const p of pts) { g.beginPath(); g.arc(p[0], p[1], 3 * px, 0, Math.PI * 2); g.fill(); }
    drawLabel(g, (last[0] + cur[0]) / 2, (last[1] + cur[1]) / 2, fmtFt1(dist(last[0], last[1], cur[0], cur[1])), { align: 'center', dy: -16 });
  }
  const d = A.drag;
  if (d && d.mode === 'rect') {
    const [x1, y1] = d.a, [x2, y2] = d.b;
    g.fillStyle = d.kind === 'room' ? 'rgba(239,227,198,.10)' : 'rgba(241,196,107,.12)'; g.strokeStyle = d.kind === 'room' ? '#efe3c6' : '#f1c46b'; g.lineWidth = 2.5 * px;
    g.setLineDash(d.kind === 'room' ? [] : [6 * px, 4 * px]);
    g.fillRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1)); g.strokeRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
    g.setLineDash([]);
    drawLabel(g, Math.max(x1, x2), Math.max(y1, y2), `${fmtFt(Math.abs(x2 - x1))} × ${fmtFt(Math.abs(y2 - y1))}`, { dx: 10, dy: 14 });
  }
  if (d && d.mode === 'doorDraw') {
    g.strokeStyle = '#e0a63e'; g.lineWidth = 4 * px; g.lineCap = 'round'; g.beginPath(); g.moveTo(d.a[0], d.a[1]); g.lineTo(d.b[0], d.b[1]); g.stroke();
    drawLabel(g, d.b[0], d.b[1], fmtFt1(dist(d.a[0], d.a[1], d.b[0], d.b[1])), { dx: 12, dy: -14 });
  }
  if (d && d.mode === 'marquee') {
    g.strokeStyle = '#f1c46b'; g.lineWidth = 1 * px; g.setLineDash([4 * px, 3 * px]);
    g.strokeRect(Math.min(d.a[0], d.b[0]), Math.min(d.a[1], d.b[1]), Math.abs(d.b[0] - d.a[0]), Math.abs(d.b[1] - d.a[1])); g.setLineDash([]);
  }
  g.restore();
}

    if (d.mode === 'rect' || d.mode === 'doorDraw') { d.b = snapPoint(w); requestRender(); return; }
    if (d.mode === 'tpl') {
      const t = d.tpl; const L = dist(d.o[0], d.o[1], w[0], w[1]);
      if (L * A.cam.z > 4) d.moved = true;
      if (!d.moved) return;
      const len = snapLen(L, e.altKey);
      if (t.kind === 'circle') t.r = len;
      else { const a = Math.atan2(w[1] - d.o[1], w[0] - d.o[0]); t.x2 = d.o[0] + Math.cos(a) * len; t.y2 = d.o[1] + Math.sin(a) * len; }
      requestRender(); return;
    }
  },
  up(e) {
    const s = scene();
    if (A.ruler && A.ruler.active && A.ruler.dragging) {
      const { sx, sy } = this.pos(e);
      if (Math.hypot(sx - A.ruler.sx, sy - A.ruler.sy) > 5) this.finishRuler();
      else { A.ruler.dragging = false; A.ruler.pts = [A.ruler.pts[0], A.ruler.pts[0].slice()]; }
      return;
    }
    const d = A.drag; if (!d || !s) return;
    A.drag = null;
    if (d.mode === 'pan') { $('#stage').style.cursor = A.space ? 'grab' : (A.tool === 'select' ? 'default' : 'crosshair'); requestRender(); return; }
    if (d.mode === 'token') {
      const t = findToken(d.id);
      if (!d.moved || !t) { requestRender(); return; }
      const dash = e.shiftKey || d.dash;
      if (isDM()) {
        if (!dash) t.moved = Math.round(((t.moved || 0) + pathLen(d.path.concat([d.cur]))) * 10) / 10;
        changed('dyn');
      } else {
        Client.send({ t: 'move', id: d.id, drag: d.dragId, pts: d.pending, final: true, dash });
        if (!dash) t.moved = Math.round(((t.moved || 0) + pathLen(d.path.concat([d.cur]))) * 10) / 10;
        Vision.invalidate(); UI.dirty('ctx');
      }
      requestRender(); return;
    }
    if (d.mode === 'wallHandle') { changed('geom'); return; }
    if (d.mode === 'image' || d.mode === 'imgResize') { changed('geom'); return; }
    if (d.mode === 'tplMove') { if (d.movedT) changed('dyn'); return; }
    if (d.mode === 'rect') { addRoom(d.a, d.b, d.kind === 'room'); requestRender(); return; }
    if (d.mode === 'doorDraw') {
      if (dist(d.a[0], d.a[1], d.b[0], d.b[1]) >= 1) { pushUndo(); const w = addWall(d.a[0], d.a[1], d.b[0], d.b[1], 'door'); if (w) select('wall', w.id); changed('geom'); }
      requestRender(); return;
    }
    if (d.mode === 'tpl') {
      const t = d.tpl;
      if (!d.moved) {
        if (t.kind === 'circle') t.r = +A.opts.circleR || 15;
        else { const len = t.kind === 'cone' ? (+A.opts.coneLen || 30) : (+A.opts.lineLen || 30); t.x2 = t.x + len; t.y2 = t.y; }
      }
      Act.send('tplAdd', { tpl: t });
      requestRender(); return;
    }
  },
  dbl(e) {
    const s = scene(); if (!s) return;
    if (A.chain) { finishChain(); return; }
    if (A.ruler && A.ruler.active) { A.ruler.pts.pop(); this.finishRuler(); return; }
    if (isDM() && A.tool === 'select') {
      const { w } = this.pos(e);

  },
  key(e) {
    const tg = e.target; const typing = tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT' || tg.isContentEditable);
    if (typing) { if (e.key === 'Escape') tg.blur(); return; }
    if (!A.role || $('#app').hidden || $('#modalRoot').firstChild) { if (e.key === 'Escape') UI.closeModal(); return; }
    const k = e.key.toLowerCase(); const mod = e.ctrlKey || e.metaKey;
    if (e.key === ' ') { if (!A.space) { A.space = true; $('#stage').style.cursor = 'grab'; } e.preventDefault(); return; }
    if (mod && k === 'z') { e.preventDefault(); if (e.shiftKey) doRedo(); else doUndo(); return; }
    if (mod && k === 'y') { e.preventDefault(); doRedo(); return; }
    if (mod && k === 's') { e.preventDefault(); if (isDM()) saveFile(); return; }
    if (mod && k === 'd') { e.preventDefault(); duplicateToken(); return; }
    if (mod) return;
    if (e.key === 'Escape') { if (A.chain) finishChain(); else if (A.ruler && A.ruler.active) { A.ruler.pts.pop(); this.finishRuler(); } else if (A.drag) { A.drag = null; requestRender(); } else select(null); UI.closeMenus(); return; }
    if (e.key === 'Enter') { if (A.chain) finishChain(); return; }
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelection(); return; }
    if (e.key === '+' || e.key === '=') { Stage.zoomAt(Stage.W / 2, Stage.H / 2, 1.25); return; }
    if (e.key === '-' || e.key === '_') { Stage.zoomAt(Stage.W / 2, Stage.H / 2, 0.8); return; }
    if (e.key === '?') { UI.help(); return; }
    const tl = tools().find((t) => t.key === k);
    if (tl) { setTool(tl.id); }
  }
};

async function pickMapImage() {
  const f = await pickFile('image/*'); if (!f) return;
  try {
    toast('Adding image…');
    const r = await processMapImage(f);
    const id = addAsset(r.data, r.mime);
    const ppf = +A.opts.imgPx5 || 70; const wft = r.w / ppf * 5, hft = r.h / ppf * 5;
    const s = scene(); pushUndo();
    const im = { id: uid(), asset: id, x: round1(A.cam.x - wft / 2), y: round1(A.cam.y - hft / 2), w: round1(wft), h: round1(hft), nw: r.w, nh: r.h, locked: false };
    if (!s.images.length && !s.walls.length && !s.floors.length) { im.x = 0; im.y = 0; s.w = Math.max(s.w, Math.ceil(wft)); s.h = Math.max(s.h, Math.ceil(hft)); }
    s.images.push(im); select('image', im.id); changed('geom');
    if (s.images.length === 1) Stage.fit();
    toast('Image added. Set its scale on the right.');
  } catch (err) { toast(err.message || 'Could not add that image'); }
}
function pickFile(accept) {

}
