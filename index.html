    const owners = `<option value="">Nobody (DM only)</option>` + Object.entries(P).map(([id, p]) => `<option value="${id}" ${t.owner === id ? 'selected' : ''}>${esc(p.name)}${Host.pidOnline(id) ? '' : ' (offline)'}</option>`).join('');
    const box = (k, label, val, ph = '') => `<label class="statbox"><span class="k">${label}</span><input data-tf="${k}" value="${esc(val ?? '')}" placeholder="${ph}" inputmode="decimal"></label>`;
    return `<div class="sec">
      <div class="tokhead">${this.badge(t, true)}<div class="grow"><label class="sr" for="tName">Name</label><input id="tName" class="tokname-in" data-tf="name" value="${esc(t.name)}" maxlength="32">
        <select class="input side-label" data-tf="side" aria-label="Side" style="height:26px;width:max-content;padding:0 6px">${[['party', 'Party'], ['enemy', 'Enemy'], ['neutral', 'NPC / neutral']].map(([k, l]) => `<option value="${k}" ${t.side === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <button class="btn icon" data-act="dupToken" aria-label="Duplicate token" title="Duplicate (Ctrl+D)">${icon('dup', 18)}</button><button class="btn icon danger" data-act="delSel" aria-label="Delete token" title="Delete">${icon('trash', 18)}</button></div>
      ${this.hpBlock(t, true)}
      <div class="grid3">${box('hp', 'HP', t.hp)}${box('maxHp', 'Max HP', t.maxHp)}${box('shield', 'Shield', t.shield)}</div>
    </div>
    <div class="sec"><div class="sec-h">This turn</div>${this.actsBlock(t, true)}${this.moveBlock(t, true)}</div>
    <div class="sec"><div class="sec-h">Tokens</div>${this.statusGrid(t)}</div>
    <div class="sec"><div class="grid3">${box('speed', 'Movespeed ft', t.speed)}${box('vision', 'Vision ft', t.vision, '∞')}${box('size', 'Size ft', t.size)}</div>
      <p class="note" style="margin:0">Vision: leave blank for unlimited sight (walls still block it), 0 for none. Party tokens share vision with all players.</p>
      <label class="field">Controlled by<select class="input" data-tf="owner">${owners}</select></label>
      <label class="switch"><input type="checkbox" data-tf="hidden" ${t.hidden ? 'checked' : ''}>Always hidden from players</label>
      <div class="row"><button class="btn" data-act="portrait">${icon('image', 16)}${t.img ? 'Change portrait' : 'Add portrait'}</button>${t.img ? '<button class="btn" data-act="portraitRemove">Remove</button>' : ''}</div>
    </div>`;
  },
  wallInspector(w) {
    const L = dist(w.x1, w.y1, w.x2, w.y2);
    const note = { wall: 'Blocks sight and movement.', window: 'Blocks movement but not sight.', door: 'Blocks sight and movement until opened. Players can open unlocked doors next to their tokens; you can double-click doors on the map.' }[w.kind];
    return `<div class="sec"><div class="sec-h">${KIND_LABEL[w.kind]}<span class="mono" style="text-transform:none">${fmtFt1(L)}</span></div>
      <div class="seg">${['wall', 'window', 'door'].map((k) => `<button data-act="wallKind" data-k="${k}" aria-pressed="${w.kind === k}">${KIND_LABEL[k]}</button>`).join('')}</div>
      ${w.kind === 'door' ? `<div class="seg"><button data-act="doorOpen" data-v="0" aria-pressed="${!w.open}">Closed</button><button data-act="doorOpen" data-v="1" aria-pressed="${!!w.open}">Open</button></div>
      <label class="switch"><input type="checkbox" data-wf="locked" ${w.locked ? 'checked' : ''}>${icon('lock', 16)}Locked (players can't open it)</label>` : ''}
      <p class="note" style="margin:0">${note} Drag the square handles on the map to reshape it.</p>
      <div class="row"><button class="btn danger" data-act="delSel">${icon('trash', 16)}Delete</button></div></div>`;
  },
  imageInspector(im) {
    const px5 = im.nw ? round1(im.nw * 5 / im.w) : '';
    return `<div class="sec"><div class="sec-h">Map image</div>
      <div class="grid2"><label class="field">Width (ft)<input class="input mono" data-if="w" value="${esc(im.w)}" inputmode="decimal"></label>
      <label class="field">Image pixels per 5 ft<input class="input mono" data-if="px5" value="${esc(px5)}" inputmode="decimal"></label></div>
      <p class="note" style="margin:0">If the image has a grid printed on it, enter the size of one square in pixels. ${im.nw ? `Original size ${im.nw} × ${im.nh} px.` : ''} Drag the corner handle on the map to resize.</p>
      <label class="switch"><input type="checkbox" data-if="locked" ${im.locked ? 'checked' : ''}>Lock in place</label>
      <div class="row wrap"><button class="btn" data-act="imgOrder" data-dir="back">Send to back</button><button class="btn" data-act="imgOrder" data-dir="front">Bring to front</button><button class="btn" data-act="fitScene">Fit scene to image</button></div>
      <div class="row"><button class="btn danger" data-act="delSel">${icon('trash', 16)}Delete image</button></div></div>`;
  },
  tplInspector(t) {
    const mine = isDM() || t.owner === A.me.id;
    return `<div class="sec"><div class="sec-h">Template</div>
      <div style="font-size:15px">${esc(tplLabel(t))}</div><div class="small">Placed by ${esc(playerName(t.owner))}</div>
      ${isDM() ? `<label class="field">Lasts<select class="input" data-pf="lasts">${LASTS.map(([v, l]) => `<option value="${v}" ${+t.lasts === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>` : ''}
      ${t.lasts > 0 ? `<div class="small">${t.left} turn${t.left === 1 ? '' : 's'} left</div>` : ''}
      ${mine ? `<div class="row"><button class="btn danger" data-act="delSel">${icon('trash', 16)}Remove</button></div>` : ''}</div>`;
  },
  floorInspector(f) {
    return `<div class="sec"><div class="sec-h">Floor</div>
      <label class="field">Style<select class="input" data-ff="style">${Object.entries(FLOOR_STYLES).map(([k, v]) => `<option value="${k}" ${f.style === k ? 'selected' : ''}>${v.label}</option>`).join('')}</select></label>
      <p class="note" style="margin:0">Floors are decoration only. Use walls, windows and doors for sight and movement.</p>
      <div class="row"><button class="btn danger" data-act="delSel">${icon('trash', 16)}Delete floor</button></div></div>`;
  },
  partyRows(list) {
    if (!list.length) return '<p class="note" style="margin:0">No party tokens yet. Place one with the Token tool and set its side to Party.</p>';
    return `<div class="party">${list.map((t) => {
      const img = t.img && A.assets[t.img] ? A.assets[t.img].data : null;
      const hf = t.maxHp ? clamp(t.hp / t.maxHp, 0, 1) : 0; const sp = +t.speed || 0, mv = +t.moved || 0; const a = t.act || {};
      return `<button class="pa" data-act="focusToken" data-id="${t.id}" style="${img ? `background-image:url('${img}')` : ''}" aria-label="Find ${esc(t.name)}">${img ? '' : esc(initials(t.name))}</button>
        <div class="pn"><span>${esc(t.name)}${t.owner && !isDM() && t.owner === A.me.id ? ' <span class="small">(you)</span>' : ''}</span><div class="bar xthin"><div class="hp" style="width:${hf * 100}%"></div></div><div class="bar mv"><div class="mvf ${mv > sp + 0.05 ? 'over' : ''}" style="width:${sp ? Math.min(100, mv / sp * 100) : 0}%"></div></div></div>
        <div class="pnum"><span>${round1(t.hp)}/${round1(t.maxHp)}</span><span class="mvt">${round1(mv)}/${sp} ft</span></div>
        <div class="pips" aria-label="Major ${a.major ? 'used' : 'ready'}, minor ${a.minor ? 'used' : 'ready'}, reaction ${a.react ? 'used' : 'ready'}"><span class="pip ${a.major ? 'used' : 'major'}"></span><span class="pip ${a.minor ? 'used' : 'minor'}"></span><span class="pip ${a.react ? 'used' : 'react'}"></span></div>`;
    }).join('')}</div>`;
  },
  scenePanel() {
    const s = scene(); const c = A.campaign; const P = c.players;
    const pl = Object.entries(P);
    const plist = pl.length ? `<div class="plist">${pl.map(([id, p]) => {
      const own = s.tokens.filter((t) => t.owner === id).map((t) => t.name).join(', ');
      return `<div class="pl"><span class="dot ${Host.pidOnline(id) ? '' : 'bad'}" title="${Host.pidOnline(id) ? 'Online' : 'Offline'}"></span><span class="grow" style="color:${p.color};font-weight:600">${esc(p.name)}</span><span class="small" style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${own ? esc(own) : 'no token'}</span></div>`;
    }).join('')}</div><p class="note" style="margin:0">Give a player a token: select it on the map and pick them under "Controlled by".</p>`
      : '<p class="note" style="margin:0">Share the room code. Players appear here when they join.</p>';
    return `<div class="sec"><div class="sec-h">Players<button class="btn sm" data-act="copyInvite">${icon('copy', 14)}Copy invite</button></div>
        <div class="row" style="gap:10px"><span class="mono" style="font-size:22px;letter-spacing:.1em">${esc(fmtCode(c.room))}</span><span class="small">room code</span></div>${plist}</div>
      <div class="sec"><div class="sec-h">Party</div>${this.partyRows(s.tokens.filter((t) => t.side === 'party'))}</div>
      <div class="sec"><div class="sec-h">Scene</div>
        <label class="field">Name<input class="input" data-sf="name" value="${esc(s.name)}" maxlength="40"></label>
        <div class="grid2"><label class="field">Width (ft)<input class="input mono" data-sf="w" value="${s.w}" inputmode="decimal"></label><label class="field">Height (ft)<input class="input mono" data-sf="h" value="${s.h}" inputmode="decimal"></label></div>
        <label class="switch"><input type="checkbox" data-sf="drawWalls" ${s.drawWalls ? 'checked' : ''}>Draw walls on the map (turn off for image maps)</label>
        <div class="row wrap"><button class="btn" data-act="fogReset">${icon('fog', 16)}Reset explored fog</button><button class="btn" data-act="fit">Fit to screen</button></div></div>
      <div class="sec"><div class="sec-h">Table</div>
        <label class="field">Campaign name<input class="input" data-cf="name" value="${esc(c.name)}" maxlength="40"></label>
        <label class="switch"><input type="checkbox" data-cf="enemyHp" ${c.settings.enemyHp ? 'checked' : ''}>Players see enemy HP</label>
        <label class="switch"><input type="checkbox" data-cf="anyPartyMove" ${c.settings.anyPartyMove ? 'checked' : ''}>Players can move any party token</label>
        <div class="row wrap"><button class="btn" data-act="save">${icon('save', 16)}Save file</button><button class="btn" data-act="open">${icon('open', 16)}Open file</button></div>
        <p class="note" style="margin:0">Lantern autosaves in this browser. Save a file to back up a campaign or move it to another computer.</p></div>`;
  },
  playerCtx() {
    const s = scene(); if (!s) return '<div class="sec"><p class="note">Waiting for the DM to share the map…</p></div>';
    const mine = s.tokens.filter((t) => t.owner === A.me.id);
    let h = '';
    const o = selectedObj();
    if (o && A.sel.type === 'token' && o.owner !== A.me.id) {
      h += `<div class="sec"><div class="tokhead">${this.badge(o, true)}<div class="grow"><span class="tokname">${esc(o.name)}</span><span class="small" style="color:${SIDE_COLOR[o.side]}">${{ party: 'Party', enemy: 'Enemy', neutral: 'NPC' }[o.side] || ''}</span></div></div>
        ${this.hpBlock(o, false)}${this.statusChips(o)}${o.side === 'party' ? this.actsBlock(o, false) + this.moveBlock(o, false) : ''}</div>`;
    } else if (o && A.sel.type === 'tpl') h += this.tplInspector(o);
    if (!mine.length) h += '<div class="sec"><div class="sec-h">You</div><p class="note" style="margin:0">The DM hasn\'t given you a token yet. You can still ping, measure and roll dice.</p></div>';
    for (const t of mine) {
      const edit = this.stEdit[t.id];
      h += `<div class="sec" data-tok="${t.id}"><div class="tokhead">${this.badge(t, true)}<div class="grow"><span class="tokname">${esc(t.name)} <span class="small" style="font-weight:400">(you)</span></span><span class="small">Movespeed ${t.speed} ft</span></div>
          <button class="btn icon" data-act="focusToken" data-id="${t.id}" aria-label="Center on ${esc(t.name)}">${icon('find', 18)}</button></div>
        ${this.hpBlock(t, true)}
        <div class="sec-h" style="margin-top:2px">Tokens<button class="btn sm" data-act="stEdit" data-id="${t.id}">${edit ? 'Done' : 'Edit'}</button></div>
        ${edit ? this.statusGrid(t) : this.statusChips(t)}
        <div class="sec-h">This turn</div>${this.actsBlock(t, true)}${this.moveBlock(t, false)}</div>`;
    }
    h += `<div class="sec"><div class="sec-h">Party</div>${this.partyRows(s.tokens.filter((t) => t.side === 'party'))}</div>`;
    return h;
  },

  /* ---------- log ---------- */
  renderLog() {
    const ol = $('#logList'); const near = ol.scrollHeight - ol.scrollTop - ol.clientHeight < 40;
    ol.innerHTML = A.log.slice(-120).map((e) => {
      if (e.kind === 'turn') return `<li class="turn">${esc(e.text)}</li>`;
      if (e.kind === 'info') return `<li class="muted">${esc(e.text)}</li>`;
      return `<li class="${e.secret ? 'secret' : ''}"><span><span class="who" style="color:${esc(e.color || '#cdbf9f')}">${esc(e.who === A.me.id ? 'You' : e.name)}</span> rolled ${esc(e.expr)}${e.label ? ` <span class="muted">· ${esc(e.label)}</span>` : ''}</span><span class="det">${esc(e.detail)} = <b>${esc(e.total)}</b></span></li>`;
    }).join('');
    if (near) ol.scrollTop = ol.scrollHeight;
  },

  /* ---------- menus & modals ---------- */
  closeMenus() { $$('.menu').forEach((m) => m.remove()); },
  menu(anchor, items) {
    this.closeMenus();
    const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
    m.innerHTML = items.map((it) => it === '-' ? '<hr>' : `<button role="menuitem" data-act="${it.act}" ${it.id ? `data-id="${it.id}"` : ''} class="${it.cur ? 'cur' : ''}">${it.icon ? icon(it.icon, 16) : ''}${esc(it.label)}</button>`).join('');
    document.body.appendChild(m);
    const r = anchor.getBoundingClientRect(); m.style.left = Math.min(r.left, innerWidth - m.offsetWidth - 8) + 'px'; m.style.top = (r.bottom + 6) + 'px';
    setTimeout(() => document.addEventListener('pointerdown', (e) => { if (!m.contains(e.target)) m.remove(); }, { once: true }), 0);
  },
  modal(html) {
    const root = $('#modalRoot');
    root.innerHTML = `<div class="modal-bg" data-act="modalBg"><div class="modal" role="dialog" aria-modal="true">${html}<div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="closeModal">Close</button></div></div></div>`;
    const first = root.querySelector('input,button'); if (first) first.focus();
  },
  closeModal() { $('#modalRoot').innerHTML = ''; },
  help() {
    const dm = isDM();
    const rows = (dm ? [
      ['V / R / P', 'Select, Ruler, Ping'], ['W / N / D', 'Wall, Window, Door'], ['M / F / E', 'Room, Floor, Erase'], ['I / T', 'Add map image, place Token'], ['C / O / L', 'Circle, Cone, Line templates'],
      ['Ctrl+Z / Ctrl+Y', 'Undo / redo map edits'], ['Ctrl+D', 'Duplicate selected token'], ['Ctrl+S', 'Save campaign file'], ['Delete', 'Delete selection'], ['Alt + drag', 'Move a token through walls']
    ] : [
      ['V / P / R', 'Move, Ping, Ruler'], ['C / O / L', 'Circle, Cone, Line templates'], ['X', 'Clear your templates'], ['Shift on release', 'Move without spending movement (Dash, Blink)'], ['Delete', 'Remove your selected template']
    ]).concat([['Wheel / + / −', 'Zoom'], ['Space + drag, right-drag', 'Pan the map'], ['Esc', 'Cancel or finish drawing'], ['Dice', 'Type rolls like 2d6+6 or 3d8 + 2 fire']]);
    const turn = LS.get('turn', {}) || {};
    this.modal(`<h2>${dm ? 'Running the table' : 'Playing at the table'}</h2>
      ${dm ? `<p class="note" style="margin:0">Players open this same page and enter room code <b class="mono">${esc(fmtCode(A.campaign.room))}</b>. Your browser tab is the server: keep it open, and the game autosaves here. Party tokens share vision; enemies only appear to players when a party token can see them.</p>` : '<p class="note" style="margin:0">Drag your token to move. Walls, windows and closed doors block you; doors open when you click them from within 10 ft. The fog shows what the party can see now (bright), has seen before (dim) and has never seen (black).</p>'}
      <table>${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>
      <details><summary style="cursor:pointer;color:var(--soft)">Connection trouble?</summary>
        <p class="note">Lantern connects browsers directly. A few strict networks (some school, work or mobile networks) block that. If one player can't connect, they can add a TURN relay server here (from any TURN provider). Everyone who has trouble enters the same one.</p>
        <div class="grid2"><label class="field">TURN URL<input class="input mono" id="turnUrl" placeholder="turn:example.com:3478" value="${esc(turn.urls || '')}"></label><label class="field">Username<input class="input" id="turnUser" value="${esc(turn.username || '')}"></label><label class="field">Password<input class="input" id="turnPass" type="password" value="${esc(turn.credential || '')}"></label>
        <div style="display:flex;align-items:flex-end"><button class="btn" data-act="saveTurn">Save, then reload</button></div></div>
        ${dm ? '<p class="note">Room code stuck as busy? <button class="btn sm" data-act="newCode">Switch to a new room code</button></p>' : ''}
      </details>`);
  }
};

/* ---------- click actions ---------- */
const Actions = {
  tool: (b) => setTool(b.dataset.id),
  toggleFog: () => { A.showFog = !A.showFog; UI.dirty('rail'); requestRender(); },
  togglePreview: () => { A.preview = !A.preview; if (A.preview) { finishChain(); select(null); } UI.dirty('rail', 'hint', 'opts', 'legend', 'ctx'); requestRender(); },
  findMe: () => { const s = scene(); const t = s && s.tokens.find((k) => k.owner === A.me.id); if (t) { Stage.centerOn(t.x, t.y); select('token', t.id); } else toast("You don't have a token yet"); },
  focusToken: (b) => { const t = findToken(b.dataset.id); if (t) { Stage.centerOn(t.x, t.y); select('token', t.id); } },
  endTurn: () => endTurn(),
  copyInvite: async () => {
    const code = fmtCode(A.campaign.room);
    if (/^https?:$/.test(location.protocol)) { const ok = await copyText(`${location.origin}${location.pathname}#join=${code}`); toast(ok ? 'Invite link copied' : `Room code: ${code}`); }
    else { const ok = await copyText(code); toast(ok ? `Copied ${code}. Friends also need this Lantern file.` : `Room code: ${code}`, 4000); }
  },
  sceneMenu: (b) => {
    const c = A.campaign;
    const items = c.sceneOrder.map((id) => ({ act: 'switchScene', id, label: c.scenes[id].name, cur: id === c.activeSceneId }));
    items.push('-', { act: 'newScene', label: 'New empty scene', icon: 'plus' }, { act: 'newSample', label: 'New sample scene (Sunken Chapel)', icon: 'plus' });
    if (c.sceneOrder.length > 1) items.push('-', { act: 'delScene', label: 'Delete this scene', icon: 'trash' });
    UI.menu(b, items);
  },
  switchScene: (b) => { UI.closeMenus(); switchScene(b.dataset.id); },
  newScene: () => { UI.closeMenus(); const s = emptyScene(nameNumber('Scene', Object.values(A.campaign.scenes).map((x) => x.name))); carryParty(s); addScene(s); },
  newSample: () => { UI.closeMenus(); const cur = scene(); if (cur && !cur.walls.length && !cur.floors.length && !cur.images.length && !cur.tokens.length && A.campaign.sceneOrder.length === 1) { const s = sampleScene(); s.id = cur.id; A.campaign.scenes[cur.id] = s; A.undo = []; changed('both'); Stage.fit(); return; } addScene(sampleScene()); },
  delScene: () => {
    UI.closeMenus(); const c = A.campaign; if (c.sceneOrder.length < 2) return;
    if (!confirm(`Delete the scene "${scene().name}"? This can't be undone.`)) return;
    const id = c.activeSceneId; c.sceneOrder = c.sceneOrder.filter((x) => x !== id); delete c.scenes[id]; delete Fog.recs[id];
    switchScene(c.sceneOrder[0]);
  },
  save: () => saveFile(),
  open: () => openFile(false),
  help: () => UI.help(),
  closeModal: () => UI.closeModal(),
  modalBg: (b, e) => { if (e.target === b) UI.closeModal(); },
  saveTurn: () => { const urls = $('#turnUrl').value.trim(); LS.set('turn', urls ? { urls, username: $('#turnUser').value.trim(), credential: $('#turnPass').value } : null); toast('Saved. Reloading…'); setTimeout(() => location.reload(), 600); },
  newCode: () => { if (!confirm('Switch to a new room code? Players will need the new code.')) return; A.campaign.room = makeRoomCode(); Host.stop(); Host.start(A.campaign.room); saveSoon(); UI.closeModal(); UI.dirty('top', 'ctx'); toast(`New room code: ${fmtCode(A.campaign.room)}`); },
  leave: () => { if (!confirm('Leave the table?')) return; Client.stop(); history.replaceState(null, '', location.pathname + location.search); location.reload(); },
  panel: () => { $('#app').classList.toggle('nopanel'); setTimeout(() => Stage.resize(), 0); },
  delSel: () => deleteSelection(),
  dupToken: () => duplicateToken(),
  hp: (b) => {
    const t = selectedForEdit(b); if (!t) return;
    const n = Math.max(0, +A.amt || 0); if (!n) return toast('Enter an amount first');
    const k = b.dataset.k; let hp = +t.hp || 0, sh = +t.shield || 0;
    if (k === 'dmg') { const a = Math.min(sh, n); sh -= a; hp -= (n - a); }
    else if (k === 'heal') hp = Math.min(+t.maxHp || hp + n, hp + n);
    else sh += n;
    Act.patchToken(t, { hp: round1(hp), shield: round1(sh) });
  },
  actT: (b) => { const t = selectedForEdit(b); if (!t) return; const a = Object.assign({ major: false, minor: false, react: false }, t.act); a[b.dataset.k] = !a[b.dataset.k]; Act.patchToken(t, { act: a }); },
  stT: (b) => { const t = selectedForEdit(b); if (!t) return; const st = Object.assign({}, t.st); if (st[b.dataset.st]) delete st[b.dataset.st]; else st[b.dataset.st] = 1; Act.patchToken(t, { st }); },
  stEdit: (b) => { UI.stEdit[b.dataset.id] = !UI.stEdit[b.dataset.id]; UI.dirty('ctx'); },
  resetMove: () => { const t = selectedObj(); if (t) Act.patchToken(t, { moved: 0 }); },
  portrait: async () => {
    const t = selectedObj(); if (!t) return; const f = await pickFile('image/*'); if (!f) return;
    try { const r = await processTokenImage(f); t.img = addAsset(r.data, r.mime); changed('dyn'); } catch (e) { toast(e.message); }
  },
  portraitRemove: () => { const t = selectedObj(); if (t) { t.img = null; changed('dyn'); } },
  wallKind: (b) => { const w = selectedObj(); if (!w) return; pushUndo(); w.kind = b.dataset.k; w.open = false; changed('geom'); },
  doorOpen: (b) => { const w = selectedObj(); if (!w) return; w.open = b.dataset.v === '1'; changed('geom'); },
  imgOrder: (b) => { const s = scene(); const im = selectedObj(); if (!im) return; pushUndo(); s.images = s.images.filter((x) => x !== im); if (b.dataset.dir === 'back') s.images.unshift(im); else s.images.push(im); changed('geom'); },
  fitScene: () => { const s = scene(); const im = selectedObj(); if (!im) return; pushUndo(); const dx = -im.x, dy = -im.y; for (const k of s.images) { k.x += dx; k.y += dy; } for (const w of s.walls) { w.x1 += dx; w.x2 += dx; w.y1 += dy; w.y2 += dy; } for (const f of s.floors) f.pts = f.pts.map(([x, y]) => [x + dx, y + dy]); for (const t of s.tokens) { t.x += dx; t.y += dy; } s.w = Math.ceil(im.w); s.h = Math.ceil(im.h); Fog.reset(s); changed('both'); Stage.fit(); },
  fogReset: () => { const s = scene(); if (!confirm('Reset explored fog for this scene? Players will only see what their tokens can see right now.')) return; Fog.reset(s); Vision.party(s); Host.broadcast({ t: 'explored', sceneId: s.id, data: Fog.get(s).cv.toDataURL('image/png'), reset: true }); requestRender(); toast('Explored fog reset'); },
  fit: () => Stage.fit(),
  clearTpls: () => { Rules.tplClear('dm'); toast('Templates cleared'); },
  opt: (b) => { A.opts[b.dataset.k] = b.dataset.v; finishChain(); UI.dirty('opts'); },
  newSampleFromHint: () => Actions.newSample()
};
function selectedForEdit(b) {
  const holder = b.closest('[data-tok]');
  const t = holder ? findToken(holder.dataset.tok) : selectedObj();
  return t && canControl(t) ? t : null;
}

function bindUI() {
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const fn = Actions[b.dataset.act]; if (fn) { if (b.tagName !== 'INPUT') e.preventDefault(); fn(b, e); }
  });
  document.addEventListener('input', (e) => { if (e.target.id === 'amt') A.amt = e.target.value; });
  document.addEventListener('focusout', (e) => { if ($('#ctx').contains(e.target)) setTimeout(() => { if (UI.ctxPending) UI.renderCtx(); }, 0); });
  document.addEventListener('change', (e) => {
    const el = e.target; const d = el.dataset; const val = el.type === 'checkbox' ? el.checked : el.value;
    const num = (v) => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : null; };
    if (d.opt) { A.opts[d.opt] = num(val) ?? val; if (d.opt === 'snap') requestRender(); return; }
    if (d.tf) {
      const t = selectedObj(); if (!t || !isDM()) return; const k = d.tf; let v = val;
      if (['hp', 'maxHp', 'shield', 'speed', 'size', 'moved'].includes(k)) { v = num(val); if (v == null) { UI.dirty('ctx'); return; } if (k === 'size') v = clamp(v, 0.5, 100); if (k === 'shield' || k === 'speed' || k === 'maxHp') v = Math.max(0, v); }
      if (k === 'vision') v = String(val).trim() === '' ? null : Math.max(0, num(val) ?? 0);
      if (k === 'owner') v = val || null;
      if (k === 'name') v = String(val).trim().slice(0, 32) || t.name;
      if (k === 'side' || k === 'name' || k === 'owner') pushUndo();
      t[k] = v; changed('dyn'); return;
    }
    if (d.wf) { const w = selectedObj(); if (w) { w[d.wf] = val; changed('geom'); } return; }
    if (d.ff) { const f = selectedObj(); if (f) { f[d.ff] = val; changed('geom'); } return; }
    if (d.pf) { const t = selectedObj(); if (t) { t.lasts = t.left = num(val) || 0; changed('dyn'); } return; }
    if (d.if) {
      const im = selectedObj(); if (!im) return; pushUndo();
      if (d.if === 'locked') im.locked = val;
      else { const v = num(val); if (v && v > 0) { const asp = im.h / im.w; if (d.if === 'w') im.w = v; else if (im.nw) im.w = round1(im.nw / v * 5); im.h = round1(im.w * asp); } }
      changed('geom'); return;
    }
    if (d.sf) {
      const s = scene(); if (d.sf === 'name') s.name = String(val).trim().slice(0, 40) || s.name;
      else if (d.sf === 'drawWalls') s.drawWalls = val;
      else { const v = num(val); if (v && v >= 10 && v <= 2000) s[d.sf] = v; }
      changed('geom'); return;
    }
    if (d.cf) { const c = A.campaign; if (d.cf === 'name') c.name = String(val).trim().slice(0, 40) || c.name; else c.settings[d.cf] = val; changed('dyn'); }
  });
  $('#rollForm').addEventListener('submit', (e) => {
    e.preventDefault(); const v = $('#rollIn').value.trim(); if (!v) return;
    if (!parseRoll(v)) { toast('Try a roll like 2d6+6 or 1d20 + 3'); return; }
    Act.send('roll', { expr: v, secret: isDM() && $('#secretRoll').checked }); $('#rollIn').value = '';
  });
  $('#zIn').onclick = () => Stage.zoomAt(Stage.W / 2, Stage.H / 2, 1.25);
  $('#zOut').onclick = () => Stage.zoomAt(Stage.W / 2, Stage.H / 2, 0.8);
  $('#zFit').onclick = () => Stage.fit();
}

/* ---------- scenes (DM) ---------- */
function carryParty(s) {
  const cur = scene(); if (!cur) return;
  const party = cur.tokens.filter((t) => t.side === 'party');
  party.forEach((t, i) => s.tokens.push(Object.assign(deep(t), { id: uid(), x: round1(s.w / 2 + (i - (party.length - 1) / 2) * 7), y: round1(s.h / 2), moved: 0 })));
}
function addScene(s) { const c = A.campaign; c.scenes[s.id] = s; c.sceneOrder.push(s.id); switchScene(s.id); }
function switchScene(id) {
  const c = A.campaign; if (!c.scenes[id]) return;
  finishChain(); c.activeSceneId = id; A.sel = null; A.undo = []; A.redo = []; A.rulers = {}; A.ruler = null;
  changed('both'); Stage.fit();
  addLog({ kind: 'info', text: `Scene: ${c.scenes[id].name}` });
}
function saveFile() { const c = serializeCampaign(); downloadText(`${slug(c.name)}.lantern.json`, JSON.stringify(c)); toast('Campaign file saved to your downloads'); }
async function openFile(fromLobby) {
  const f = await pickFile('.json,application/json'); if (!f) return;
  try {
    const obj = JSON.parse(await f.text()); const c = await loadCampaignObject(obj);
    if (fromLobby) { Main.startHost(c); return; }
    c.room = A.campaign.room; A.campaign = c; A.log = c.log; A.sel = null; A.undo = []; A.redo = [];
    changed('both'); Stage.fit(); UI.all(); toast(`Opened ${c.name}`);
  } catch (e) { toast(e.message || 'Could not open that file'); if (fromLobby) Lobby.status(e.message || 'Could not open that file'); }
}

/* ============================================================
   Lobby and startup
   ============================================================ */
const Lobby = {
  async init() {
    const q = new URLSearchParams(location.search); A.local = q.has('local');
    $('#lbName').value = LS.get('name', '');
    const m = location.hash.match(/join=([A-Za-z0-9-]+)/); if (m) { $('#lbCode').value = fmtCode(m[1]); setTimeout(() => ($('#lbName').value ? $('#lbCode') : $('#lbName')).focus(), 50); }
    $('#lbCode').addEventListener('input', (e) => { const v = fmtCode(e.target.value); if (v !== e.target.value) e.target.value = v; });
    $('#lbNew').onclick = () => Main.startHost(newCampaign());
    $('#lbOpen').onclick = () => openFile(true);
    $('#lbJoinForm').addEventListener('submit', (e) => {
      e.preventDefault(); const name = $('#lbName').value.trim(); const code = normCode($('#lbCode').value);
      if (!name) { this.status('Enter your name first.'); return; }
      if (code.length !== 6) { this.status('Room codes have 6 letters and numbers, like KX7-42Q.'); return; }
      Main.startPlayer(code, name);
    });
    if (A.local) $('#lbNote').innerHTML = 'Same-computer test mode: open this page in another tab with <b>?local</b> to join as a player.';
    else if (location.protocol === 'file:') $('#lbNote').textContent = 'Opened from a file. Players need their own copy of this file, or host it online and share the link.';
    const saved = await IDB.get('autosave');
    if (saved && saved.scenes) {
      const b = $('#lbResume'); b.hidden = false;
      b.textContent = `Resume "${saved.name || 'campaign'}" · room ${fmtCode(saved.room)}`;
      b.onclick = async () => { try { Main.startHost(await loadCampaignObject(deep(saved))); } catch (e) { this.status(e.message); } };
    }
  },
  status(t) { $('#lbStatus').textContent = t || ''; },
  clientStatus(s) {
    if (Client.welcomed) return;
    const msg = { connecting: 'Connecting to the table…', nohost: "No table is open with that code right now. Still trying (check the code, and that the DM's tab is open)…", offline: "Can't reach the matchmaking server. Check your internet; retrying…", nolib: 'This browser cannot make peer-to-peer connections. Try Chrome, Edge or Firefox.' }[s];
    if (msg) { $('#lbStatus').style.color = s === 'connecting' ? 'var(--muted)' : 'var(--danger)'; this.status(msg); }
  },
  enterApp() {
    $('#lobby').hidden = true; $('#app').hidden = false;
    if (innerWidth < 760) $('#app').classList.add('nopanel');
    $('#secretWrap').hidden = !isDM();
    Stage.resize(); UI.all(); UI.zoomLabel();
    setTool(A.tool);
  }
};

const Main = {
  startHost(c) {
    A.role = 'dm'; A.campaign = c; A.log = c.log || (c.log = []); A.me = { id: 'dm', name: 'DM', color: DM_COLOR }; A.tool = 'select';
    Lobby.enterApp(); Stage.fit();
    Host.start(c.room); saveSoon();
    history.replaceState(null, '', location.pathname + location.search);
    window.addEventListener('beforeunload', (e) => { saveSoon(); if (Object.keys(Host.clients).length) { e.preventDefault(); e.returnValue = ''; } });
    addLog({ kind: 'info', text: `Table open · room ${fmtCode(c.room)}` });
  },
  startPlayer(code, name) {
    let pid = null; try { pid = sessionStorage.getItem('lantern.pid'); } catch (e) { /* */ }
    if (!pid) pid = A.local ? uid() : (LS.get('pid', null) || uid());
    A.role = 'player'; A.me = { id: pid, name, color: '#7fb3ff' }; A.tool = 'select';
    LS.set('name', name);
    $('#lbStatus').style.color = 'var(--muted)'; Lobby.status('Connecting to the table…');
    Client.start(code, name);
  }
};

window.addEventListener('DOMContentLoaded', () => {
  Stage.init(); Input.init(); bindUI(); Lobby.init();
  window.LanternDebug = { A, Host, Client, Vision, Fog, Rules, scene, Stage, UI };
});

</script>
